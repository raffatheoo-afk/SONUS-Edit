workflows:
  # Keep this workflow id stable: the persistent Sonus Edit signer cache belongs to this lineage.
  sonus-edit-0-0-3-code03-debug:
    name: Sonus Edit 0.0.15 debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/codemagic
        - $HOME/.sonus-edit-signing

    scripts:
      - name: Prepare Sonus Edit package
        script: |
          set -euo pipefail
          EXTRACT_ROOT="$CM_BUILD_DIR/_sonus_edit"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          ZIP=""
          for candidate in \
            "$CM_BUILD_DIR/SonusEdit.zip" \
            "$CM_BUILD_DIR/Sonus Edit.zip" \
            "$CM_BUILD_DIR/Sonus%20Edit.zip"; do
            if [ -f "$candidate" ]; then ZIP="$candidate"; break; fi
          done
          if [ -z "$ZIP" ]; then
            echo "ERROR: Sonus Edit ZIP not found in repository root."
            find "$CM_BUILD_DIR" -maxdepth 1 -type f -print
            exit 21
          fi

          unzip -q "$ZIP" -d "$EXTRACT_ROOT"
          SETTINGS="$(find "$EXTRACT_ROOT" -maxdepth 3 -type f -name settings.gradle.kts | head -n 1)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "SONUS_EDIT_PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Projeto extraído em: $PROJECT_DIR"

      - name: Validate Sonus Edit project
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"

          # Core project files.
          test -f app/src/main/java/com/sonusstudios/sonusedit/ui/HomeScreen.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/ui/AutomationSettingsScreen.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/ui/SonusEditApp.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/create/AutomationPlanner.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/lyrics/PCloudLyricsRepository.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/lyrics/StreamLyricsResolver.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/media/ExportForegroundService.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/media/VideoVisualEffects.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          test -f app/src/main/res/drawable-nodpi/sonus_edit_logo_transparent.png

          # Version/package identity.
          grep -q 'applicationId = "com.sonusstudios.sonusedit"' app/build.gradle.kts
          grep -q 'versionCode = 15' app/build.gradle.kts
          grep -q 'versionName = "0.0.15"' app/build.gradle.kts
          grep -q 'noCompress += "mp4"' app/build.gradle.kts
          grep -q 'media3-transformer:1.10.1' app/build.gradle.kts
          ! grep -q 'media3-transformer:1.11.1' app/build.gradle.kts
          test "$(grep -c 'androidx.media3:media3-.*:1.10.1' app/build.gradle.kts)" -eq 5
          grep -q '<string name="app_name">Sonus Edit</string>' app/src/main/res/values/strings.xml
          grep -q 'Text("0.0.15"' app/src/main/java/com/sonusstudios/sonusedit/ui/HomeScreen.kt
          grep -q 'Text("0.0.15"' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt

          # code14 raw video particle engine: two independent original 9:16 MP4s, no atlas.
          test -f app/src/main/res/raw/sonus_particles_green_60fps.mp4
          test -f app/src/main/res/raw/sonus_particles_black_30fps.mp4
          test -f app/src/main/res/raw/sonus_video_key_vertex.glsl
          test -f app/src/main/res/raw/sonus_video_key_fragment.glsl
          test -f app/src/main/res/drawable-nodpi/sonus_transparent_timing.png
          # Browser-safe stream-copy loops: preserve original frames while keeping SonusEdit.zip below the 25 MiB GitHub web-upload ceiling.
          GREEN_BYTES="$(wc -c < app/src/main/res/raw/sonus_particles_green_60fps.mp4)"
          BLACK_BYTES="$(wc -c < app/src/main/res/raw/sonus_particles_black_30fps.mp4)"
          test "$GREEN_BYTES" -gt 15000000
          test "$GREEN_BYTES" -lt 22000000
          test "$BLACK_BYTES" -gt 2500000
          test "$BLACK_BYTES" -lt 4500000
          ! test -e app/src/main/res/drawable-nodpi/effect_particles_source.webp
          ! test -e app/src/main/res/drawable-nodpi/effect_particles_source_alt.webp
          grep -q 'const val RAW_GREEN_60 = "raw_green_60"' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticEffectSelector.kt
          grep -q 'const val RAW_BLACK_30 = "raw_black_30"' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticEffectSelector.kt
          grep -q 'val all = listOf(RAW_GREEN_60, RAW_BLACK_30)' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticEffectSelector.kt
          grep -q 'ORIGINAL_60("Original 60 FPS", "raw_green_60")' app/src/main/java/com/sonusstudios/sonusedit/create/AutomationPreferences.kt
          grep -q 'ORIGINAL_30("Original 30 FPS", "raw_black_30")' app/src/main/java/com/sonusstudios/sonusedit/create/AutomationPreferences.kt
          grep -q 'class RawParticleVideoEffect' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          grep -q 'override fun toGlShaderProgram(context: Context, useHdr: Boolean): GlShaderProgram {' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          grep -q '^class RawParticleKeyShaderProgram(' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          ! grep -q '^private class RawParticleKeyShaderProgram(' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          grep -q 'mutableStateOf<String>(EffectIds.RAW_GREEN_60)' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          ! grep -R -q 'EffectIds.STAR' app/src/main/java
          grep -q 'enum class Mode { GREEN_CHROMA, BLACK_LUMA }' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          grep -q 'R.raw.sonus_particles_green_60fps' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          grep -q 'R.raw.sonus_particles_black_30fps' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          grep -q 'val loopDurationMs: Long' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          grep -q '16_000L' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          grep -q '15_000L' app/src/main/java/com/sonusstudios/sonusedit/media/RawParticleVideoEffect.kt
          grep -q 'vec3 key = vec3(0.0262412, 0.1946178, 0.0221739)' app/src/main/res/raw/sonus_video_key_fragment.glsl
          grep -q 'alpha = smoothstep(0.010, 0.240, brightness)' app/src/main/res/raw/sonus_video_key_fragment.glsl
          ! grep -R -q 'particles_rainbow\|particles_bright\|particles_firefly\|particles_star\|particles_glitter\|effect_particles_source\|drawAnimatedEffect\|atlasFrames\|effectFps' app/src/main app/build.gradle.kts

          # Preserve natural 9:16 overlay and requested output cadence: no particle crop/zoom/interpolation.
          grep -q 'private fun buildTransparentTimingSequence' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'private fun materializeBundledResource' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'Uri.fromFile(target)' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          ! grep -q 'android.resource://' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'exportErrorMessage(error)' app/src/main/java/com/sonusstudios/sonusedit/media/ExportForegroundService.kt
          grep -q 'SonusEditExport' app/src/main/java/com/sonusstudios/sonusedit/media/ExportForegroundService.kt
          grep -q 'setFrameRate(draft.exportFps)' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'AlphaScale(0f)' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'private fun buildRawParticleSequence' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'Presentation.LAYOUT_SCALE_TO_FIT' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'RawParticleVideoEffect(source.mode, draft.automaticEffectOpacity)' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'while (remainingMs > 0L)' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'remainingMs.coerceAtMost(source.loopDurationMs)' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'Composition.Builder(timingSequence, rawParticleSequence, videoSequence, audioSequence)' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          grep -q 'ExactPortraitCompositorSettings' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt

          # code13 typography/caption/Gallery features remain intact.
          grep -q 'DEFAULT("Patrick Hand")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'MODERN("Concert One")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'ELEGANT("Amatic SC")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'IMPACT("Rancho")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'HANDWRITTEN("Sheila Crayon")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'MINIMAL("Schoolwork-Regular")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'NEON("Alley Garden")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'RETRO("Playball")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'enum class LyricColorPreset' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'DYNAMIC("Dinâmico")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'SignatureFontPreset' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'SignatureColorPreset' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'Pesquisar imagens carregadas' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'Cor da legenda' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'Fonte da assinatura' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'Cor da assinatura' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt

          # code14 small-screen signature colors: the whole button is the chosen sample color.
          grep -q 'containerColor = previewColor' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'modifier = Modifier.weight(1f).height(42.dp)' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'BorderStroke(' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt

          # Established stable image/lyrics/export behaviors.
          grep -q 'private fun rankImageAssets(assets: List<PCloudAsset>, metadata: AudioMetadata?)' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'val rankedImageCatalog = remember(imageCatalog, metadata?.title, metadata?.genre)' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'remoteAssets = rankedImageCatalog' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          ! grep -q 'ContextualImageSelector' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'const val PUBLIC_CODE = "kZNiXQJZTobHXlzVPjzsj9LyASRI77DUtfJk"' app/src/main/java/com/sonusstudios/sonusedit/lyrics/PCloudLyricsRepository.kt
          grep -q 'suspend fun loadSelected' app/src/main/java/com/sonusstudios/sonusedit/lyrics/PCloudLyricsRepository.kt
          grep -q 'streamLyrics.resolveSelected' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'sanitizeLyricText' app/src/main/java/com/sonusstudios/sonusedit/media/VideoVisualEffects.kt
          grep -q 'safeWidth = canvas.width \* 0.84f' app/src/main/java/com/sonusstudios/sonusedit/media/VideoVisualEffects.kt
          grep -q 'EXECUÇÃO 2° PLANO' app/src/main/java/com/sonusstudios/sonusedit/ui/EditorScreen.kt
          grep -q 'ExportForegroundService' app/src/main/AndroidManifest.xml
          grep -q 'GERAR OUTRA COMBINAÇÃO' app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          grep -q 'SUGESTÃO PARA O PRÓXIMO VÍDEO' app/src/main/java/com/sonusstudios/sonusedit/ui/HomeScreen.kt
          grep -q 'by SONUS STUDIOS - RΛFΛ亗' app/src/main/java/com/sonusstudios/sonusedit/ui/SonusEditApp.kt

          # Established duration/resolution/FPS rules.
          grep -q 'DurationPreset(15, "15s")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'private val automaticDurations = listOf(30, 40, 50, 60, 65, 90, 120)' app/src/main/java/com/sonusstudios/sonusedit/create/AutomationPlanner.kt
          grep -q 'P720("720p", 720, 1280)' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'P1080("1080p", 1080, 1920)' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'P2K("2K", 1440, 2560)' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'P4K("4K", 2160, 3840)' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'METADATA_KEY_VIDEO_ROTATION' app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt

          echo "Sonus Edit 0.0.14 / code14 validation passed."

      - name: Restore persistent Sonus Edit signing
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"

          if [ -n "${SONUS_KEYSTORE_PATH:-}" ] && [ -n "${SONUS_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${SONUS_KEY_ALIAS:-}" ] && [ -n "${SONUS_KEY_PASSWORD:-}" ]; then
            test -f "$SONUS_KEYSTORE_PATH"
            echo "Using secure persistent Sonus Edit signer."
            exit 0
          fi

          SIGN_DIR="$HOME/.sonus-edit-signing"
          KEYSTORE="$SIGN_DIR/sonus-edit-dev.jks"
          PROPS="$SIGN_DIR/signing.env"
          if [ ! -f "$KEYSTORE" ] || [ ! -f "$PROPS" ]; then
            echo "ERROR: persistent Sonus Edit signing key was not restored."
            echo "Build stopped intentionally to prevent a different APK signature."
            exit 41
          fi

          chmod 600 "$PROPS" "$KEYSTORE"
          . "$PROPS"
          : "${SONUS_KEYSTORE_PASSWORD:?missing persistent store password}"
          : "${SONUS_KEY_ALIAS:?missing persistent key alias}"
          : "${SONUS_KEY_PASSWORD:?missing persistent key password}"
          keytool -list -keystore "$KEYSTORE" -storepass "$SONUS_KEYSTORE_PASSWORD" -alias "$SONUS_KEY_ALIAS" >/dev/null

          echo "SONUS_KEYSTORE_PATH=$KEYSTORE" >> "$CM_ENV"
          echo "SONUS_KEYSTORE_PASSWORD=$SONUS_KEYSTORE_PASSWORD" >> "$CM_ENV"
          echo "SONUS_KEY_ALIAS=$SONUS_KEY_ALIAS" >> "$CM_ENV"
          echo "SONUS_KEY_PASSWORD=$SONUS_KEY_PASSWORD" >> "$CM_ENV"
          echo "Reusing persistent Sonus Edit signer."

      - name: Install Gradle 8.13
        script: |
          set -euo pipefail
          GRADLE_VERSION=8.13
          GRADLE_HOME_CM="$HOME/.gradle/codemagic/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME_CM/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle/codemagic"
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "/tmp/gradle-${GRADLE_VERSION}.zip"
            unzip -q "/tmp/gradle-${GRADLE_VERSION}.zip" -d "$HOME/.gradle/codemagic"
          fi
          echo "GRADLE_CM=$GRADLE_HOME_CM/bin/gradle" >> "$CM_ENV"
          "$GRADLE_HOME_CM/bin/gradle" --version

      - name: Unit tests
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"
          "$GRADLE_CM" --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"
          "$GRADLE_CM" --no-daemon --stacktrace :app:assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$APK" "$CM_BUILD_DIR/artifacts/SonusEdit.apk"
          keytool -printcert -jarfile "$CM_BUILD_DIR/artifacts/SonusEdit.apk" \
            | sed -n '/SHA256:/p' > "$CM_BUILD_DIR/artifacts/SIGNER_SHA256.txt" || true
          shasum -a 256 "$CM_BUILD_DIR/artifacts/SonusEdit.apk" \
            | tee "$CM_BUILD_DIR/artifacts/SHA256.txt"

    artifacts:
      - artifacts/SonusEdit.apk
      - artifacts/SHA256.txt
      - artifacts/SIGNER_SHA256.txt
      - "_sonus_edit/**/app/build/test-results/**"
      - "_sonus_edit/**/app/build/reports/**"
