workflows:
  sonus-edit-0-1-0-code01-debug:
    name: SONUS Edit 0.1.0 code01 debug
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/codemagic
    scripts:
      - name: Validate code01 project
        script: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          test -f app/src/main/res/drawable-nodpi/sonus_edit_logo.png
          grep -q 'applicationId = "com.sonusstudios.sonusedit"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0"' app/build.gradle.kts
          grep -q 'DurationPreset(600, "10m")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'MIN_IMAGE_SECONDS = 5' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt

      - name: Install Gradle 8.13
        script: |
          set -euo pipefail
          GRADLE_VERSION=8.13
          GRADLE_HOME_CM="$HOME/.gradle/codemagic/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME_CM/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle/codemagic"
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "/tmp/gradle-${GRADLE_VERSION}.zip"
            unzip -q "/tmp/gradle-${GRADLE_VERSION}.zip" -d "$HOME/.gradle/codemagic"
          fi
          echo "GRADLE_CM=$GRADLE_HOME_CM/bin/gradle" >> "$CM_ENV"
          "$GRADLE_HOME_CM/bin/gradle" --version

      - name: Unit tests
        script: |
          set -euo pipefail
          "$GRADLE_CM" --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        script: |
          set -euo pipefail
          "$GRADLE_CM" --no-daemon --stacktrace :app:assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256.txt

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/debug/SHA256.txt
      - app/build/test-results/**
      - app/build/reports/**
