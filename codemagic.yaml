workflows:
  sonus-code127-debug:
    name: SONUS 1.0.24 code127 - APK
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17
      vars:
        GRADLE_VERSION: "8.13"
        SONUS_REAL_ADS: "true"

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/codemagic

    scripts:
      - name: Preparar e validar SONUS 1.0.24
        script: |
          set -euo pipefail
          echo "=== SONUS 1.0.24 / code127 ==="
          SRC_ZIP="$CM_BUILD_DIR/StreamPulse.zip"
          WORK_DIR="$CM_BUILD_DIR/_sonus_code127"

          if [ ! -f "$SRC_ZIP" ]; then
            echo "ERRO: StreamPulse.zip não encontrado na raiz do repositório."
            ls -la "$CM_BUILD_DIR"
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$SRC_ZIP" -d "$WORK_DIR"

          SETTINGS_FILE="$(find "$WORK_DIR" -maxdepth 4 -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: settings.gradle.kts não encontrado dentro de StreamPulse.zip."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          export PROJECT_DIR
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Projeto localizado em: $PROJECT_DIR"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/MainActivity.kt"
          UPDATE_FILE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/cloud/SonusUpdateSystem.kt"
          TOOL_SUITE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/ToolSuiteScreen.kt"
          TUNER_FILE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/PulseStudioProTools.kt"
          CREATOR_ENGINE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/CreatorAudioEngine.kt"
          AUDIO_ENGINE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/AudioToolEngine.kt"
          PLAYER_FILE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/PulsePlayerService.kt"
          STREAM_FILE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/stream/SonusStreamPlatform.kt"
          ONLINE_FILE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/SonusOnlineMusic.kt"
          LRC_EDITOR="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/LrcEditorTool.kt"
          PLAYER_SCREEN="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/PulsePlayerScreen.kt"
          PLAYER_STATS="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/PulsePlayerStatsStore.kt"
          ADS_FILE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/ads/AdManager.kt"
          VIDEO_UTIL_FILE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/VideoUtilityTools.kt"
          SONUS_EDIT_BRIDGE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/integration/SonusEditBridge.kt"
          VIDEO_EFFECTS_FILE="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/video/SonusVideoEffects.kt"
          COMPOSITION_EXPORTER="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/video/PulseCompositionExporter.kt"
          PRESETS_FILE="$PROJECT_DIR/app/src/main/assets/presets_pulsestudio.json"
          UPDATE_PATHS="$PROJECT_DIR/app/src/main/res/xml/sonus_update_file_paths.xml"

          test -f "$APP_GRADLE"
          grep -Fq 'applicationId = "com.sonusstudios.streampulse"' "$APP_GRADLE"
          grep -Fq 'compileSdk = 36' "$APP_GRADLE"
          grep -Fq 'targetSdk = 36' "$APP_GRADLE"
          grep -Fq 'minSdk = 26' "$APP_GRADLE"
          grep -Fq 'versionCode = 127' "$APP_GRADLE"
          grep -Fq 'versionName = "1.0.24"' "$APP_GRADLE"
          grep -Fq 'SONUS_UPDATE_PCLOUD_PUBLIC_CODE' "$APP_GRADLE"
          grep -Fq 'kZPPs8JZNBif4G3VzdfDsowilxjXSVFBUHAy' "$APP_GRADLE"
          grep -Fq 'ffmpeg-kit-full:8.1.7' "$APP_GRADLE"
          if grep -Fq 'ffmpeg-kit-audio:8.1.7' "$APP_GRADLE"; then
            echo "ERRO: variantes Full e Audio do FFmpegKit não devem coexistir."
            exit 1
          fi
          echo "Base confirmada: SONUS 1.0.24 / code127"

          python3 -m json.tool "$PROJECT_DIR/firebase-database-rules.json" >/dev/null
          python3 -m json.tool "$PROJECT_DIR/firebase-realtime-database.rules.json" >/dev/null
          python3 -m json.tool "$PRESETS_FILE" >/dev/null
          python3 - <<'PY'
          import json, os
          root=os.environ['PROJECT_DIR']
          for name in ('firebase-database-rules.json','firebase-realtime-database.rules.json'):
              rules=json.load(open(os.path.join(root,name),encoding='utf-8'))['rules']
              assert 'updates' in rules
              assert 'current' in rules['updates'] and 'history' in rules['updates']
              assert rules['updates']['current'].get('.read') is True
              assert 'streamPublicPlayClaims' in rules
              assert rules['streamStats']['$fileId']['playCount'].get('.read') is True
          print('Firebase update/counter rules: OK')
          PY

          # SONUS Update / Owner.
          test -f "$UPDATE_FILE"
          test -f "$UPDATE_PATHS"
          grep -Fq 'REQUEST_INSTALL_PACKAGES' "$MANIFEST"
          grep -Fq '${applicationId}.updates' "$MANIFEST"
          grep -Fq 'showpublink' "$UPDATE_FILE"
          grep -Fq 'getpublinkdownload' "$UPDATE_FILE"
          grep -Fq 'AUTO_CHECK_INTERVAL_MS = 12L * 60L * 60L * 1000L' "$UPDATE_FILE"
          grep -Fq 'updates/current' "$UPDATE_FILE"
          grep -Fq 'updates/history' "$UPDATE_FILE"
          grep -Fq 'SHA-256' "$UPDATE_FILE"
          grep -Fq 'SonusOwnerUpdatePanel' "$UPDATE_FILE"
          grep -Fq 'PUBLICAR ATUALIZAÇÃO' "$UPDATE_FILE"
          grep -Fq 'Retomar publicação' "$UPDATE_FILE"
          grep -Fq 'Histórico de publicações' "$UPDATE_FILE"
          grep -Fq 'SonusUpdateDialog' "$MAIN_FILE"
          grep -Fq 'Checar atualização' "$MAIN_FILE"
          grep -Fq 'Novidades desta versão' "$MAIN_FILE"

          # Renomear imagens: SAF correto + MediaStore real.
          grep -Fq 'FLAG_SUPPORTS_RENAME.toLong()' "$TOOL_SUITE"
          grep -Fq 'MediaStore.getMediaUri' "$TOOL_SUITE"
          grep -Fq 'MediaStore.MediaColumns.DISPLAY_NAME' "$TOOL_SUITE"
          grep -Fq 'PROVIDER_NO_RENAME' "$TOOL_SUITE"
          grep -Fq 'MEDIASTORE_WRITE_DENIED' "$TOOL_SUITE"

          # Conversor de Vídeo: argumentos estruturados, sem filtro com aspas aninhadas.
          grep -Fq 'suspend fun convertVideosToSonus' "$CREATOR_ENGINE"
          grep -Fq 'withContext(Dispatchers.IO)' "$CREATOR_ENGINE"
          grep -Fq 'executeWithArgumentsProgress' "$CREATOR_ENGINE"
          grep -Fq 'executeWithArgumentsAsync' "$CREATOR_ENGINE"
          grep -Fq 'suspendCancellableCoroutine<Unit>' "$CREATOR_ENGINE"
          grep -Fq 'val filter = "scale=${targetWidth}:${targetHeight},fps=$targetFps"' "$CREATOR_ENGINE"
          grep -Fq 'ffmpegFriendlyFailure' "$CREATOR_ENGINE"
          grep -Fq 'conversionJob?.cancel()' "$VIDEO_UTIL_FILE"
          if grep -Fq "scale='if(gte(iw,ih)" "$CREATOR_ENGINE"; then
            echo "ERRO: filtro frágil antigo reapareceu no Conversor de Vídeo."
            exit 1
          fi

          # Gravador: arquivo privado finalizado antes da publicação no MediaStore + novo visual.
          grep -Fq 'Gravação salva em SONUS/Recordings' "$TOOL_SUITE"
          grep -Fq 'SonusStorage.createAudio(context, publicName, "audio/wav", SonusStorage.Bucket.RECORDINGS)' "$TOOL_SUITE"
          grep -Fq 'Ajustes do gravador' "$TOOL_SUITE"
          grep -Fq 'Qualidade de captura' "$TOOL_SUITE"
          grep -Fq 'Salvar/exportar em $format' "$TOOL_SUITE"
          grep -Fq 'Excluir' "$TOOL_SUITE"
          grep -Fq 'sonus_recorder_history_v1' "$TOOL_SUITE"
          grep -Fq 'Histórico limpo. Seus áudios foram preservados.' "$TOOL_SUITE"

          # SONUS Tune: automático, estabilizado, sem controles manuais antigos.
          grep -Fq 'TunerStabilizer' "$TUNER_FILE"
          grep -Fq 'centsWindow' "$TUNER_FILE"
          grep -Fq 'candidateCount < 3' "$TUNER_FILE"
          grep -Fq 'now - lastValidAt <= 420L' "$TUNER_FILE"
          grep -Fq 'Detecção automática • cromática' "$TUNER_FILE"
          grep -Fq 'animationSpec = spring' "$TUNER_FILE"
          grep -Fq 'import androidx.compose.ui.draw.clip' "$TUNER_FILE"
          if grep -Eq 'Drop D|Open G|430f\.\.450f|guitarTunings' "$TUNER_FILE"; then
            echo "ERRO: ajustes manuais antigos reapareceram no SONUS Tune."
            exit 1
          fi

          # Guardas de regressão: motores que não deveriam mudar nesta rodada.
          AUDIO_SHA="$(shasum -a 256 "$AUDIO_ENGINE" | awk '{print $1}')"
          PLAYER_SHA="$(shasum -a 256 "$PLAYER_FILE" | awk '{print $1}')"
          STREAM_SHA="$(shasum -a 256 "$STREAM_FILE" | awk '{print $1}')"
          [ "$AUDIO_SHA" = "6e787082a16a6f040abd61f72dc8fe0d7bfa3e1bac184fc1c2b4c5a96cf0eedd" ] || { echo "ERRO: AudioToolEngine mudou."; exit 1; }
          [ "$PLAYER_SHA" = "a348dfef4635c7989081aa56833cc87c89cc81a71efd017b1aa7c717020506e3" ] || { echo "ERRO: PulsePlayerService mudou."; exit 1; }
          [ "$STREAM_SHA" = "e4e6753df421be4d0182b708a58040188bf76a0f0c75c849a02edd38d6ae9360" ] || { echo "ERRO: SonusStreamPlatform divergiu do Build Fix 2 aprovado."; exit 1; }

          # Build Fix 2: Analytics Você preservado, contador resiliente e ponte opcional SONUS Edit.
          grep -Fq 'streamPublicPlayClaims' "$STREAM_FILE"
          grep -Fq 'reserveLocalPublicQualification' "$STREAM_FILE"
          grep -Fq 'SonusStreamUserAnalyticsDialog{showStreamAnalytics=false}' "$ONLINE_FILE"
          if grep -Fq 'FilterChip(selected = tab == "Artista"' "$ONLINE_FILE"; then
            echo "ERRO: aba Analytics Artista reapareceu."
            exit 1
          fi
          test -f "$SONUS_EDIT_BRIDGE"
          grep -Fq 'com.sonusstudios.sonusedit' "$SONUS_EDIT_BRIDGE"
          grep -Fq 'sonusedit' "$SONUS_EDIT_BRIDGE"
          grep -Fq 'com.sonusstudios.sonusedit' "$MANIFEST"
          grep -Fq 'Abrir no SONUS Edit' "$ONLINE_FILE"

          # code124 herdado: Player Stream fallback + sugestão por gênero sem autoplay.
          grep -Fq 'SONUS Stream • Sugestão' "$PLAYER_SCREEN"
          grep -Fq 'folderPromptEnabled' "$PLAYER_SCREEN"
          grep -Fq 'recentStreamSuggestionIds' "$PLAYER_SCREEN"
          grep -Fq 'latestLocalTrack' "$PLAYER_STATS"
          grep -Fq 'Quando nenhuma biblioteca local estiver vinculada' "$PLAYER_SCREEN" || true
          grep -Fq 'connected.setRepeatMode(0)' "$PLAYER_SCREEN"
          grep -Fq 'installStreamSuggestion(forceNext = true)' "$PLAYER_SCREEN"

          # code124 herdado: períodos Mês x 30 dias e sem seletor horizontal ocultando opções.
          grep -Fq 'var period by remember { mutableStateOf("Mês") }' "$PLAYER_SCREEN"
          grep -Fq '"30 dias" -> today.minusDays(29) to today' "$PLAYER_SCREEN"
          grep -Fq 'var period by rememberSaveable { mutableStateOf("Mês") }' "$MAIN_FILE"
          grep -Fq '"Mês" -> today.withDayOfMonth(1)' "$MAIN_FILE"

          # code124 herdado: Painel Desenvolvedor sem publicação de updates e em ordem operacional.
          if grep -Fq 'DeveloperModule.UPDATES' "$MAIN_FILE"; then
            echo "ERRO: painel Atualizações ainda está exposto no Painel Desenvolvedor."
            exit 1
          fi
          grep -Fq 'SONUS_MUSIC("SONUS Stream"' "$MAIN_FILE"
          grep -Fq 'RESUMO("Resumo"' "$MAIN_FILE"

          # code124 herdado: OWNER usa Rewarded oficial de teste e painel expõe diagnóstico técnico.
          grep -Fq 'forceTestUnit = isOwner' "$MAIN_FILE"
          grep -Fq 'officialRewardedTestUnitId' "$ADS_FILE"
          grep -Fq 'lastResponseInfo' "$ADS_FILE"
          grep -Fq 'lastErrorDomain' "$ADS_FILE"

          # code125: Social Edit com duração proporcional, relógio local e fade individual.
          grep -Fq 'selectedImages' "$ONLINE_FILE"
          grep -Fq 'socialEditMaxSelectedImages' "$ONLINE_FILE"
          grep -Fq 'socialEditGalleryPreviewLimit' "$ONLINE_FILE"
          grep -Fq '65 -> 13' "$ONLINE_FILE"
          grep -Fq '60, 65 -> 20' "$ONLINE_FILE"
          grep -Fq 'socialEditImageDurations' "$ONLINE_FILE"
          grep -Fq 'animationIn = "Fade In 1.5s"' "$ONLINE_FILE"
          grep -Fq 'animationOut = "Fade Out 1.5s"' "$ONLINE_FILE"
          grep -Fq 'val durations = socialEditImageDurations(actualDuration, imageFiles.size)' "$ONLINE_FILE"
          grep -Fq 'imageFiles.forEachIndexed' "$ONLINE_FILE"
          if grep -Fq 'val segmentDuration = minOf(5_000L, remaining)' "$ONLINE_FILE"; then
            echo "ERRO: duração fixa de 5s reapareceu no Social Edit."
            exit 1
          fi
          grep -Fq 'float localTime = max(0.0, uTime - max(0.0, uP3));' "$VIDEO_EFFECTS_FILE"
          grep -Fq 'wantsOnePointFiveFade' "$VIDEO_EFFECTS_FILE"
          grep -Fq 'clipStartMs' "$COMPOSITION_EXPORTER"
          python3 - <<'PY_SOCIAL'
          presets = {15:3, 30:6, 40:8, 50:10, 60:12, 65:13}
          for seconds, max_images in presets.items():
              total = seconds * 1000
              for count in range(1, max_images + 1):
                  base, remainder = divmod(total, count)
                  durations = [base] * count
                  durations[-1] += remainder
                  assert sum(durations) == total
                  assert min(durations) >= 5000, (seconds, count, durations)
          print('Social Edit duration matrix: OK')
          PY_SOCIAL

          # code126: duas fontes públicas do Stream, catálogo unificado e origem invisível.
          grep -Fq 'SONUS_PCLOUD_SECONDARY_PUBLIC_CODE' "$APP_GRADLE"
          grep -Fq 'kZjNE8JZ1u7bptnw2J7AJmDn04hFe8O3o09k' "$APP_GRADLE"
          grep -Fq 'loadCatalogFromSource' "$ONLINE_FILE"
          grep -Fq '"secondary" to secondaryPublicCode' "$ONLINE_FILE"
          grep -Fq 'sourceKeyForFileId' "$ONLINE_FILE"
          grep -Fq 'distinctBy { streamTrackIdentity(it) }' "$ONLINE_FILE"
          grep -Fq 'catalogFileId' "$ONLINE_FILE"
          grep -Fq 'rawFileIdForFileId' "$ONLINE_FILE"
          grep -Fq 'secondaryGenreNames' "$ONLINE_FILE"

          # code126: biblioteca LRC pCloud, resolução automática e fonte única.
          grep -Fq 'SONUS_LRC_PCLOUD_PUBLIC_CODE' "$APP_GRADLE"
          grep -Fq 'kZNiXQJZTobHXlzVPjzsj9LyASRI77DUtfJk' "$APP_GRADLE"
          grep -Fq 'refreshPublicLrcLibrary' "$ONLINE_FILE"
          grep -Fq 'lyricsForFileIdAuto' "$ONLINE_FILE"
          grep -Fq 'publicLrcRefForTrack' "$ONLINE_FILE"
          grep -Fq 'publicLrcText' "$ONLINE_FILE"
          grep -Fq 'repo.lyricsForFileIdAuto' "$PLAYER_SCREEN"
          grep -Fq 'DeveloperLrcLibraryScreen' "$MAIN_FILE"
          grep -Fq 'SONUS_Letras_Sincronizadas.zip' "$MAIN_FILE"
          grep -Fq 'Abrir Editor LRC' "$MAIN_FILE"
          grep -Fq 'lrcExportStem(audioName)' "$LRC_EDITOR"

          # code126: assinatura visual oficial.
          grep -Fq 'by SONUS STUDIOS - RΛFΛ亗' "$MAIN_FILE"

          # code127: biblioteca LRC OWNER unificada + varredura do catálogo.
          grep -Fq 'SonusUnifiedLrcEntry' "$ONLINE_FILE"
          grep -Fq 'cachedUnifiedLrcEntries' "$ONLINE_FILE"
          grep -Fq 'scanUnifiedLrcLibrary' "$ONLINE_FILE"
          grep -Fq 'refreshTrackOverrides()' "$ONLINE_FILE"
          grep -Fq 'unifiedLrcText' "$ONLINE_FILE"
          grep -Fq 'isSynchronizedLrc' "$ONLINE_FILE"
          grep -Fq 'source = SonusUnifiedLrcSource.PCLOUD' "$ONLINE_FILE"
          grep -Fq 'source = SonusUnifiedLrcSource.CATALOG' "$ONLINE_FILE"
          grep -Fq 'Varredura concluída' "$MAIN_FILE"
          grep -Fq 'Text("Atualizar")' "$MAIN_FILE"
          grep -Fq 'Text("Baixar todas")' "$MAIN_FILE"

          # code127: layout Developer mais compacto e atalhos 50/50.
          grep -Fq 'DeveloperModerationShortcutCard' "$MAIN_FILE"
          grep -Fq 'Modifier.fillMaxWidth().height(112.dp)' "$MAIN_FILE"
          grep -Fq 'services.chunked(3)' "$MAIN_FILE"
          grep -Fq '"database" to "Firebase"' "$MAIN_FILE"
          if grep -Fq '"Catálogo, publicação por gênero, streaming e diagnóstico da biblioteca online."' "$MAIN_FILE"; then
            echo "ERRO: card descritivo antigo do SONUS Stream ainda está exposto no Developer."
            exit 1
          fi

          # Guardas herdadas code120/code121.
          grep -Fq 'SONUS_STREAM_VIEW_COOLDOWN_MS = 15L * 60_000L' "$STREAM_FILE"
          grep -Fq 'markQualifiedPlayLocally' "$STREAM_FILE"
          grep -Fq '((duration + 1L) / 2L)' "$PLAYER_FILE"
          grep -Fq 'SONUS_STREAM_UPLOAD_BITRATE_KBPS = 256' "$STREAM_FILE"
          grep -Fq 'RADIO_VOICE' "$PLAYER_FILE"
          grep -Fq 'RADIO_MUSIC' "$PLAYER_FILE"
          grep -Fq 'INICIAR SINCRONIZAÇÃO' "$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/tools/LrcEditorTool.kt"
          grep -Fq 'Natural+' "$ONLINE_FILE"
          grep -Fq 'TikTok 1min+' "$ONLINE_FILE"
          grep -Fq 'waveformZoom' "$VIDEO_UTIL_FILE"
          grep -Fq 'convertVideosToSonus' "$CREATOR_ENGINE"

          if grep -Fq 'detectHorizontalDragGestures' "$MAIN_FILE"; then
            echo "ERRO: gesto horizontal global de troca de abas não deve voltar."
            exit 1
          fi
          if [ -f "$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse/video/PulseVideoEditorScreen.kt" ]; then
            echo "ERRO: SONUS Edit antigo não deve ser reintroduzido."
            exit 1
          fi

          echo "Validação estática code127 concluída."

      - name: Publicar regras Firebase (opcional)
        script: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON_B64:-}" ]; then
            echo "INFO: credencial Firebase não configurada no Codemagic; regras foram validadas, mas não serão publicadas automaticamente."
            echo "Para corrigir Permission denied em produção, publique firebase-database-rules.json no projeto streenpulse."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > /tmp/sonus-firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sonus-firebase-service-account.json
          cd "$PROJECT_DIR"
          npx --yes firebase-tools@latest deploy --only database --project streenpulse --non-interactive
          rm -f /tmp/sonus-firebase-service-account.json
          echo "Regras Firebase publicadas com sucesso."

      - name: Verificar Android SDK 36
        script: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERRO: Android SDK não encontrado no ambiente Codemagic."
            exit 1
          fi
          echo "sdk.dir=$SDK_ROOT" > "$PROJECT_DIR/local.properties"
          NEED_PLATFORM=0
          NEED_BUILD_TOOLS=0
          [ -d "$SDK_ROOT/platforms/android-36" ] || NEED_PLATFORM=1
          [ -d "$SDK_ROOT/build-tools/36.0.0" ] || NEED_BUILD_TOOLS=1
          if [ "$NEED_PLATFORM" -eq 1 ] || [ "$NEED_BUILD_TOOLS" -eq 1 ]; then
            SDKMANAGER=""
            for CANDIDATE in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$(command -v sdkmanager 2>/dev/null || true)"; do
              if [ -n "$CANDIDATE" ] && [ -x "$CANDIDATE" ]; then SDKMANAGER="$CANDIDATE"; break; fi
            done
            [ -n "$SDKMANAGER" ] || { echo "ERRO: SDK 36 ausente e sdkmanager não localizado."; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            PACKAGES=()
            [ "$NEED_PLATFORM" -eq 1 ] && PACKAGES+=("platforms;android-36")
            [ "$NEED_BUILD_TOOLS" -eq 1 ] && PACKAGES+=("build-tools;36.0.0")
            "$SDKMANAGER" "${PACKAGES[@]}"
          fi
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          echo "Android SDK 36 / Build Tools 36.0.0: OK"

      - name: Preparar Gradle 8.13
        script: |
          set -euo pipefail
          GRADLE_HOME_CM="$HOME/.gradle/codemagic/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME_CM/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle/codemagic"
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "/tmp/gradle-${GRADLE_VERSION}.zip"
            rm -rf "$GRADLE_HOME_CM"
            unzip -q "/tmp/gradle-${GRADLE_VERSION}.zip" -d "$HOME/.gradle/codemagic"
          fi
          "$GRADLE_HOME_CM/bin/gradle" --version
          echo "GRADLE_CM=$GRADLE_HOME_CM/bin/gradle" >> "$CM_ENV"

      - name: Compilar APK SONUS
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$CM_BUILD_DIR/sonus_artifacts"
          set +e
          "$GRADLE_CM" \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :app:assembleDebug 2>&1 | tee "$CM_BUILD_DIR/sonus_artifacts/BUILD.log"
          GRADLE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GRADLE_STATUS" -ne 0 ]; then
            echo "ERRO: assembleDebug falhou. Consulte sonus_artifacts/BUILD.log"
            exit "$GRADLE_STATUS"
          fi

      - name: Preparar APK para download
        script: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: assembleDebug terminou sem gerar app-debug.apk."
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/sonus_artifacts"
          cp "$APK" "$CM_BUILD_DIR/sonus_artifacts/SONUS.apk"
          cd "$CM_BUILD_DIR/sonus_artifacts"
          shasum -a 256 SONUS.apk > SHA256SUMS.txt
          ls -lh SONUS.apk SHA256SUMS.txt
          echo "SONUS.apk code127 pronto nos Artifacts do Codemagic."

    artifacts:
      - sonus_artifacts/SONUS.apk
      - sonus_artifacts/SHA256SUMS.txt
      - sonus_artifacts/BUILD.log
