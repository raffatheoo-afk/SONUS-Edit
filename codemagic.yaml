# ════════════════════════════════════════════════════════════════════════════════════════════
# SONUS 0.0.7 / code 07  •  codemagic.yaml
#
# TUDO O QUE O BUILD PRECISA PARA COMPILAR (confira antes de iniciar):
#
#  1) StreamPulse.zip OU StreamPulse_0.0.7_CODE07.zip na RAIZ do repositório.
#     O workflow descompacta, valida e compila esse ZIP (ou usa o projeto já extraído na raiz).
#
#  2) Grupo de variáveis "sonus_signing" no Codemagic (marcadas como SEGURAS):
#       SONUS_KEYSTORE_PASSWORD  OBRIGATÓRIA  senha do sonus-edit-dev.jks
#       SONUS_KEY_PASSWORD       opcional     senha da chave (se vazia, usa a senha do keystore)
#       SONUS_KEY_ALIAS          opcional     alias da chave (padrão: sonusedit)
#     SEM a senha, o workflow falha antes de compilar. Não existe fallback para assinatura debug/teste.
#     Nunca escreva senhas neste arquivo. Configure-as como variáveis SEGURAS no grupo sonus_signing.
#
#  3) Assinatura: o SONUS passa a usar a MESMA chave permanente do SONUS Edit (alias sonusedit).
#     O arquivo vem embutido abaixo em base64 (protegido por senha) e é restaurado em $HOME/.sonus-signing-v1.
#     O workflow confere a impressão digital da chave e, no fim, a assinatura do APK gerado.
#       SHA-256: FF:38:FE:A1:78:58:71:C7:18:9C:18:20:22:3B:E4:50:DF:58:D7:3D:CF:9C:58:B7:CA:2E:5D:F7:E5:01:CB:6F
#       SHA-1  : 8D:53:98:C9:15:E1:F0:5C:E6:C1:44:CA:EE:5A:D9:1E:31:DA:C0:92
#     Mantenha este repositório PRIVADO.
#
#  4) Firebase (login com Google): a SHA-1 e a SHA-256 acima devem estar cadastradas no app Android
#     com.sonusstudios.streampulse. O app/google-services.json deste pacote contém o cliente Android SHA-1
#     e o cliente OAuth Web do projeto streenpulse; o workflow valida projeto, pacote e clientes antes do build.
#
#  5) Firebase: FIREBASE_SERVICE_ACCOUNT_JSON_B64 (variável segura; publica regras, função sonusShare e página Hosting).
#     Sem essa credencial, o APK ainda pode compilar, mas a página pública de compartilhamento não será publicada.
#     SONUS_STREAM_PROXY_BASE, SONUS_SHARE_BASE e SONUS_TELEGRAM_UPLOAD_BASE (sobrescrevem os endereços padrão).
#     SONUS_GOOGLE_LOGIN=true  liga o botão "Entrar com Google" na tela de login. Fica ESCONDIDO por padrão; só ligue
#     quando o APK sair assinado com a chave permanente (o log termina com "Assinatura do APK conferida"),
#     porque a SHA-1 cadastrada no Firebase é a dessa chave. O login por e-mail e senha não depende disso.
#     YOUTUBE_API_KEY NÃO é mais usada: toda a integração com o YouTube foi removida do app.
#
#  6) Ambiente do build: Java 17, Android SDK 36 + Build Tools 36.0.0 e Gradle 8.13. O workflow instala
#     o que faltar. Build 0.0.7: validar o Stream renovado e as preferências de atualização antes de publicar.
# ════════════════════════════════════════════════════════════════════════════════════════════
workflows:
  sonus-code07-only-20261115:
    name: SONUS CODE07 EXCLUSIVO - 0.0.7 (versionCode 7)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17
      groups:
        - sonus_signing
      vars:
        GRADLE_VERSION: "8.13"
        SONUS_REAL_ADS: "true"

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/codemagic

    scripts:
      - name: Restaurar chave de assinatura permanente (sonus-edit-dev.jks)
        script: |
          set -euo pipefail
          if [ -z "${SONUS_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERRO: SONUS_KEYSTORE_PASSWORD não está configurada no grupo seguro 'sonus_signing'."
            echo "       Build cancelado para impedir APK com assinatura debug/teste e conflito na atualização."
            exit 1
          fi
          KEY_DIR="$HOME/.sonus-signing-v1"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          JKS="$KEY_DIR/sonus-edit-dev.jks"
          cat > "$KEY_DIR/sonus-edit-dev.jks.b64" <<'EOF_SONUS_KEY'
          
          EOF_SONUS_KEY
          base64 --decode < "$KEY_DIR/sonus-edit-dev.jks.b64" > "$JKS"
          rm -f "$KEY_DIR/sonus-edit-dev.jks.b64"
          if command -v shasum >/dev/null 2>&1; then GOT_JKS="$(shasum -a 256 "$JKS" | awk '{print $1}')"; else GOT_JKS="$(sha256sum "$JKS" | awk '{print $1}')"; fi
          if [ "$GOT_JKS" != "b3884a61a389fcc2090846ff47926935337cfc522cf367418f68eab879fb0295" ]; then
            echo "ERRO: o arquivo da chave restaurado não confere (corrompido)."
            exit 1
          fi
          ALIAS="${SONUS_KEY_ALIAS:-sonusedit}"
          if ! keytool -list -v -keystore "$JKS" -storepass "$SONUS_KEYSTORE_PASSWORD" -alias "$ALIAS" > "$KEY_DIR/keytool.txt" 2>&1; then
            echo "ERRO: não foi possível abrir o keystore. SONUS_KEYSTORE_PASSWORD ou SONUS_KEY_ALIAS incorretos?"
            exit 1
          fi
          FP="$(grep -m1 'SHA256:' "$KEY_DIR/keytool.txt" | sed 's/.*SHA256: *//' | tr -d ' ')"
          rm -f "$KEY_DIR/keytool.txt"
          if [ "$FP" != "FF:38:FE:A1:78:58:71:C7:18:9C:18:20:22:3B:E4:50:DF:58:D7:3D:CF:9C:58:B7:CA:2E:5D:F7:E5:01:CB:6F" ]; then
            echo "ERRO: a impressão digital da chave NÃO é a da chave permanente do SONUS ($FP)."
            exit 1
          fi
          echo "SONUS_KEYSTORE_PATH=$JKS" >> "$CM_ENV"
          echo "Chave de assinatura permanente restaurada e conferida (SHA-256 FF:38:FE:A1...CB:6F)."

      - name: Preparar e validar SONUS 0.0.7
        script: |
          set -euo pipefail
          echo "=== SONUS 0.0.7 / code 07 ==="
          sha256() { if command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | awk '{print $1}'; else sha256sum "$1" | awk '{print $1}'; fi; }
          # CODE07 EXCLUSIVO: não aceitar ZIP genérico, checkout da raiz ou qualquer fallback.
          # Isso impede que um StreamPulse.zip antigo (CODE06) seja compilado por engano.
          SRC_ZIP="$CM_BUILD_DIR/StreamPulse_0.0.7_CODE07.zip"
          if [ ! -f "$SRC_ZIP" ]; then
            echo "ERRO: falta StreamPulse_0.0.7_CODE07.zip na raiz do repositório."
            echo "O workflow foi bloqueado para não compilar uma versão antiga por engano."
            echo "Arquivos encontrados na raiz:"
            ls -la "$CM_BUILD_DIR"
            exit 1
          fi
          WORK_DIR="$CM_BUILD_DIR/_sonus_0_0_7"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          echo "Pacote selecionado: $SRC_ZIP"
          echo "SHA-256 do pacote: $(sha256 "$SRC_ZIP")"
          unzip -q -o "$SRC_ZIP" -d "$WORK_DIR"
          SETTINGS_FILE="$(find "$WORK_DIR" -maxdepth 5 -name settings.gradle.kts -print -quit)"
          [ -n "$SETTINGS_FILE" ] || { echo "ERRO: settings.gradle.kts não foi encontrado dentro do ZIP CODE07."; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Projeto localizado em: $PROJECT_DIR"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          [ -f "$APP_GRADLE" ] || { echo "ERRO: app/build.gradle.kts não encontrado."; exit 1; }
          grep -Eq '^[[:space:]]*versionCode = 7[[:space:]]*$' "$APP_GRADLE" || {
            echo "ERRO: o pacote selecionado NÃO é CODE07 (versionCode 7)."
            echo "Envie StreamPulse_0.0.7_CODE07.zip para a raiz do repositório e remova/substitua o ZIP antigo."
            exit 1
          }
          grep -Fq 'versionName = "0.0.7"' "$APP_GRADLE" || {
            echo "ERRO: o pacote selecionado não declara versionName 0.0.7."
            exit 1
          }
          echo "FONTE CONFIRMADA: SONUS 0.0.7 / CODE07 (versionCode 7)."
          echo "IDENTIFICADOR DO WORKFLOW: sonus-code07-only-20261115"
          J="$PROJECT_DIR/app/src/main/java/com/sonusstudios/streampulse"
          RES="$PROJECT_DIR/app/src/main/res"
          fail() { echo "ERRO: $1"; exit 1; }

          # ── Versão e identidade ──
          grep -Eq '^[[:space:]]*versionCode = 7[[:space:]]*$' "$APP_GRADLE" || fail "versionCode deve ser 7 (SONUS 0.0.7)."
          grep -Fq 'versionName = "0.0.7"' "$APP_GRADLE" || fail "versionName deve ser 0.0.7."
          grep -Fq 'applicationId = "com.sonusstudios.streampulse"' "$APP_GRADLE" || fail "applicationId alterado."
          grep -Fq 'SONUS_KEYSTORE_PATH' "$APP_GRADLE" || fail "assinatura permanente (SONUS_KEYSTORE_PATH) ausente no gradle."
          grep -Fq 'if (!hasPermanentKey)' "$APP_GRADLE" || fail "o Gradle deve bloquear builds sem a chave oficial."
          grep -Fq 'throw GradleException' "$APP_GRADLE" || fail "bloqueio de assinatura ausente no Gradle."
          grep -Fq 'signingConfig = signingConfigs.getByName("sonus")' "$APP_GRADLE" || fail "APK não está configurado para assinatura oficial."
          if grep -Fq 'signingConfigs.getByName("debug")' "$APP_GRADLE"; then fail "fallback de assinatura debug não é permitido."; fi
          [ ! -f "$PROJECT_DIR/app/beta-debug.keystore" ] || fail "a chave antiga beta-debug.keystore não deve voltar ao projeto."

          # ── Arquivos protegidos (áudio, player, stream) ──
          [ "$(sha256 "$J/tools/AudioToolEngine.kt")" = "6e787082a16a6f040abd61f72dc8fe0d7bfa3e1bac184fc1c2b4c5a96cf0eedd" ] || fail "AudioToolEngine divergiu da base aprovada."
          [ "$(sha256 "$J/tools/PulsePlayerService.kt")" = "a8e1af905eeb57c91bdcd32cf7558f0f6c08b6b5b9f8052e57c026df78298c1f" ] || fail "PulsePlayerService divergiu da base aprovada."
          [ "$(sha256 "$J/stream/SonusStreamPlatform.kt")" = "69288d3b8fd3b147295861e0aca640b0e355785e30714872e38a8ccaa0ba7179" ] || fail "SonusStreamPlatform divergiu da base aprovada."

          # ── Arquivos novos desta versão ──
          for f in tools/SonusLiveStudio.kt tools/SonusLiveMedia.kt tools/SonusLiveUsage.kt tools/SonusRadioVoices.kt \
                   tools/SonusPdfStudio.kt tools/SonusImageBatchTools.kt tools/SonusLockScreenActivity.kt \
                   tools/SonusLockScreenLyrics.kt tools/SonusStreamOpenTrace.kt tools/SonusLiveChrome.kt audio/SonusEqualizer.kt \
                   tools/SonusOfflineDownloads.kt tools/SonusAudioMonitor.kt; do
            [ -f "$J/$f" ] || fail "arquivo obrigatório ausente: $f"
          done

          # ── Funções que DEVEM existir ──
          grep -Fq 'fun cutAudioSegmentsToSonus' "$J/tools/CreatorAudioEngine.kt" || fail "Cortador de Áudio ausente."
          grep -Fq 'ToolId.MEDIA_RENAME' "$J/tools/ToolSuiteScreen.kt" || fail "Renomear áudios/vídeos ausente."
          grep -Fq 'ToolId.IMG_CROP_BATCH' "$J/tools/ToolSuiteScreen.kt" || fail "Recorte em lote ausente."
          grep -Fq 'NeonCategoryDivider' "$J/tools/ToolSuiteScreen.kt" || fail "linhas neon da aba Aplicativos ausentes."
          grep -Fq 'APLICATIVOS SONUS' "$J/tools/ToolSuiteScreen.kt" || fail "aba Aplicativos não renomeada."
          grep -Fq 'SonusLiveStudioScreen' "$J/tools/PulsePlayerScreen.kt" || fail "botão LIVE ausente no Player."
          grep -Fq 'TRACKS_PER_VOICE = 4' "$J/tools/SonusRadioEngine.kt" || fail "locução deve tocar a cada 4 músicas."
          grep -Fq 'GOOGLE_LOGIN_ENABLED' "$APP_GRADLE" || fail "chave de build do login com Google ausente."
          grep -Fq 'sonusStreamGenreStations' "$J/tools/SonusLiveStudio.kt" || fail "Studio deve usar os gêneros do Stream (não as pastas)."
          grep -Fq 'SonusLiveImmersiveEffect' "$J/tools/SonusLiveStudio.kt" || fail "modo imersivo/rotação da live ausente."
          grep -Fq 'allowAudioPlaybackCapture="true"' "$MANIFEST" || fail "captura do áudio do app deve estar permitida no manifest."
          grep -Fq 'SonusRadioVoices.PUBLIC_CODE' "$J/tools/SonusRadioVoices.kt" || grep -Fq 'const val PUBLIC_CODE' "$J/tools/SonusRadioVoices.kt" || fail "locuções da nuvem ausentes."
          grep -Fq 'invalidateInitialSnapshot' "$J/tools/SonusOnlineMusic.kt" || fail "invalidação do snapshot do Stream ausente."
          if grep -Fq 'warmProcessSnapshot()' "$J/StreamPulseApplication.kt"; then fail "o catálogo não pode ser aquecido no boot."; fi
          if grep -Fq 'SonusRadioVoices.refreshAsync(this)' "$J/StreamPulseApplication.kt"; then fail "locuções da Rádio só podem ser atualizadas sob demanda."; fi
          grep -Fq 'if (m == -1) return true' "$J/tools/SonusStreamExperience.kt" || fail "atualização a cada abertura ausente."
          grep -Fq 'fun dueForBasicRefresh' "$J/tools/SonusStreamExperience.kt" || fail "controle de intervalo dos dados básicos ausente."
          grep -Fq 'favoriteGenres' "$J/tools/SonusStreamExperience.kt" || fail "favoritos de gêneros ausentes."
          grep -Fq 'projectOfficialStreamGenres' "$J/tools/SonusOnlineMusic.kt" || fail "grade de gêneros oficiais não está separada das fontes internas."
          grep -Fq 'recent_tracks_index' "$J/tools/SonusOnlineMusic.kt" || fail "índice leve de Adicionadas recentemente ausente."
          grep -Fq 'startRadioFromCatalog' "$J/tools/SonusOnlineMusic.kt" || fail "estações da Rádio não estão sob demanda."
          grep -Fq 'genrePreferences.toggleFavoriteGenre' "$J/tools/SonusOnlineMusic.kt" || fail "ação de favoritar gênero ausente."
          grep -Fq '1440 to "24 h"' "$J/tools/SonusOnlineMusic.kt" || fail "intervalos de atualização CODE07 incompletos."
          grep -Fq '0 to "Manual"' "$J/tools/SonusOnlineMusic.kt" || fail "atualização manual não está disponível."
          grep -Fq 'SONUS_CURRENT_VERSION_SUMMARY' "$J/cloud/SonusUpdateSystem.kt" || fail "resumo da versão não está no Sobre."
          grep -Fq 'SONUS_PCLOUD_TERTIARY_PUBLIC_CODE' "$APP_GRADLE" || fail "terceira pasta musical do Stream ausente."
          if grep -Fq 'PULSE_ROTATION_WINDOW_MS' "$J/tools/SonusOnlineMusic.kt" || grep -Fq 'SonusStreamPulse(' "$J/tools/SonusOnlineMusic.kt"; then fail "prateleira promocional PULSE não deve estar na Home do Stream."; fi
          grep -Fq 'SonusTopActionChip' "$J/tools/SonusOnlineMusic.kt" || fail "novos botões superiores do Stream ausentes."
          grep -Fq 'SonusStreamQuickActionCard' "$J/tools/SonusOnlineMusic.kt" || fail "atalhos leves do Stream ausentes."
          grep -Fq 'clearArtworkCache' "$J/tools/SonusOnlineMusic.kt" || fail "limpeza de capas deve limpar cache de disco e memória."
          # ── Requisitos herdados do CODE 06: gêneros, Rádio, LIVE e envio MP3 ──
          grep -Fq '"Bossa Nova / MPB"' "$J/core/SonusMediaStandards.kt" || fail "catálogo central de gêneros ausente."
          grep -Fq '"Triste / Depressão / Melancólico"' "$J/core/SonusMediaStandards.kt" || fail "categoria de humor explícita ausente."
          grep -Fq 'SonusMediaStandards.canonicalGenre(raw)' "$J/tools/SonusOnlineMusic.kt" || fail "Stream/Rádio não usa normalizador central."
          grep -Fq 'list.size > 15' "$J/tools/SonusOnlineMusic.kt" || fail "estações automáticas devem exigir mais de 15 faixas."
          grep -Fq 'SONUS_STREAM_UPLOAD_BITRATE_KBPS = 192' "$J/stream/SonusStreamPlatform.kt" || fail "envio do Stream não está em MP3 192 kbps."
          grep -Fq 'copyExistingMp3' "$J/audio/AudioConversionEngine.kt" || fail "otimização para MP3 já em 192 kbps ausente."
          grep -Fq 'androidx.compose.material:material-icons-extended' "$APP_GRADLE" || fail "dependência de ícones Compose ausente."
          grep -Fq 'import androidx.compose.material.icons.filled.Download' "$J/tools/SonusLiveStudio.kt" || fail "ícone Download da promoção LIVE sem importação."
          grep -Fq 'import androidx.compose.material.icons.filled.Send' "$J/tools/SonusLiveStudio.kt" || fail "ícone Send/Telegram da promoção LIVE sem importação."
          grep -Fq 'countdown_seconds' "$J/tools/SonusLiveStudio.kt" || fail "preferência da contagem regressiva da LIVE ausente."
          grep -Fq 'countdownSeconds.coerceAtLeast(10)' "$J/tools/SonusLiveStudio.kt" || fail "contagem regressiva mínima de 10 segundos não está aplicada."
          grep -Fq 'preparedQueue.size < 5' "$J/tools/SonusLiveMedia.kt" || fail "fila de pré-carregamento da LIVE não mantém até cinco cenas."
          grep -Fq 'SonusLiveMediaRepo.takePrepared(latestTheme)' "$J/tools/SonusLiveMedia.kt" || fail "o palco precisa consumir a mesma fila preparada durante a configuração."
          grep -Fq 'val latestPool by rememberUpdatedState(pool)' "$J/tools/SonusLiveMedia.kt" || fail "a primeira cena não pode depender da segunda listagem da galeria."
          grep -Fq 'withTimeoutOrNull(14_000L)' "$J/tools/SonusLiveMedia.kt" || fail "a primeira imagem da LIVE precisa de timeout limitado."
          grep -Fq 'while (isActive && activeSlide == null)' "$J/tools/SonusLiveMedia.kt" || fail "o palco precisa manter fallback enquanto tenta a primeira cena."
          grep -Fq 'videoEnded.await()' "$J/tools/SonusLiveMedia.kt" || fail "vídeos da LIVE não aguardam a duração original."
          grep -Fq 'while (isActive && preparedQueue.isEmpty())' "$J/tools/SonusLiveMedia.kt" || fail "a troca de cenas deve manter a imagem atual enquanto a reposição termina."
          grep -Fq 'withContext(Dispatchers.Default)' "$J/tools/SonusLiveMedia.kt" || fail "classificação da mídia da LIVE deve sair da thread principal."
          grep -Fq 'SonusBulkMetadataEditor' "$J/tools/SonusBulkMetadataEditor.kt" || fail "editor de metadados em lote ausente."
          grep -Fq 'artistNameChangedAt' "$J/stream/SonusStreamPlatform.kt" || fail "controle de 30 dias do nome artístico ausente."
          grep -Fq 'ARTIST_NAME_CHANGE_INTERVAL_MS = 30L' "$J/stream/SonusStreamPlatform.kt" || fail "janela de 30 dias do nome artístico divergente."
          grep -Fq '2592000000' "$PROJECT_DIR/firebase-database-rules.json" || fail "regra Firebase de 30 dias ausente."
          grep -Fq 'artistNameNextChangeAt' "$J/stream/SonusStreamPlatform.kt" || fail "data da próxima alteração de nome ausente."
          grep -Fq 'publicArtistProfilesForOwner' "$J/stream/SonusStreamPlatform.kt" || fail "seletor OWNER deve obter os perfis públicos de artista."
          grep -Fq 'selectedArtistId: String? = null' "$J/stream/SonusStreamPlatform.kt" || fail "backend de submissão deve receber o artista escolhido pelo OWNER."
          grep -Fq '"artistOwnerUid" to selectedArtist.uid' "$J/stream/SonusStreamPlatform.kt" || fail "submissão deve guardar o dono do perfil artístico selecionado."
          grep -Fq 'ActivityResultContracts.OpenMultipleDocuments()' "$J/stream/SonusStreamPlatform.kt" || fail "seleção real de vários arquivos de áudio ausente."
          grep -Fq 'DialogProperties(usePlatformDefaultWidth = false)' "$J/stream/SonusStreamPlatform.kt" || fail "tela moderna de envio responsiva ausente."
          grep -Fq 'LaunchedEffect(user.uid, tier, moderationMode)' "$J/stream/SonusStreamPlatform.kt" || fail "carregamento redundante de perfis do Stream não foi removido."
          if grep -Fq 'Este é o artista da sua conta SONUS' "$J/stream/SonusStreamPlatform.kt"; then fail "cartão de perfil duplicado do artista voltou ao corpo da tela."; fi
          grep -Fq 'Color(0xFF218B51)' "$J/stream/SonusStreamPlatform.kt" || fail "estado não selecionado de aprovadas deve permanecer verde vivo."
          grep -Fq 'Color(0xFFB52E48)' "$J/stream/SonusStreamPlatform.kt" || fail "estado não selecionado de rejeitadas deve permanecer vermelho vivo."
          grep -Fq 'Color(0xFF43F08D)' "$J/stream/SonusStreamPlatform.kt" || fail "estado selecionado de aprovadas deve ter realce mais intenso."
          grep -Fq 'Color(0xFFFF718B)' "$J/stream/SonusStreamPlatform.kt" || fail "estado selecionado de rejeitadas deve ter realce mais intenso."
          grep -Fq 'artistOwnerUid' "$PROJECT_DIR/firebase-database-rules.json" || fail "regras Firebase não validam o perfil artístico associado ao envio."
          grep -Fq "!newData.child('artistId').exists() && !newData.child('artistOwnerUid').exists()" "$PROJECT_DIR/firebase-database-rules.json" || fail "regras Firebase devem exigir ambos os campos do artista ou nenhum (compatibilidade legada)."
          grep -Fq 'it.artistId.isNotBlank()' "$J/stream/SonusStreamPlatform.kt" || fail "envio em lote do OWNER exige artista selecionado por faixa."
          grep -Fq 'selectedArtistId = track.artistId' "$J/stream/SonusStreamPlatform.kt" || fail "cada faixa deve persistir o artista escolhido para ela."
          grep -Fq 'Artista desta faixa' "$J/stream/SonusStreamPlatform.kt" || fail "seletor de artista individual por faixa ausente no lote."
          grep -Fq 'withContext(Dispatchers.Default)' "$J/tools/SonusOnlineMusic.kt" || fail "processamento do catálogo Stream precisa sair da thread principal."
          grep -Fq 'radioPreparing = true' "$J/tools/SonusOnlineMusic.kt" || fail "montagem da Rádio ainda não está isolada da interface."
          grep -Fq 'creatorListsExpanded by rememberSaveable { mutableStateOf(false) }' "$J/stream/SonusStreamPlatform.kt" || fail "listas de artista não iniciam recolhidas."
          if grep -Fq 'Esta música utiliza IA' "$J/stream/SonusStreamPlatform.kt"; then fail "controle de IA removido voltou ao formulário."; fi
          grep -Fq 'SonusLiveMediaRepo.warmUp(context, count = 1' "$J/tools/SonusLiveStudio.kt" || fail "a LIVE deve preparar apenas uma cena inicial."
          grep -Fq 'val canStart = remainingSeconds > 0L && when (source)' "$J/tools/SonusLiveStudio.kt" || fail "início da LIVE não pode depender do carregamento das cinco imagens."
          if grep -Fq 'preparedSceneCount >= 5' "$J/tools/SonusLiveStudio.kt"; then fail "a LIVE não pode bloquear o início esperando cinco imagens."; fi
          grep -Fq 'svc.state.first { it.playing && it.current != null }' "$J/tools/SonusLiveStudio.kt" || fail "LIVE precisa confirmar reprodução musical real antes de entrar no ar."
          if grep -Fq 'LiveLyricLine' "$J/tools/SonusLiveStudio.kt"; then fail "texto central grande de letra não pode voltar à LIVE."; fi
          if grep -Fq 'LiveNoLyricsPanel' "$J/tools/SonusLiveStudio.kt"; then fail "painel central antigo da LIVE não foi removido."; fi
          grep -Fq 'Telegram  @sonusappupdate' "$J/tools/SonusLiveStudio.kt" || fail "bloco inferior compacto com Telegram da LIVE ausente."
          grep -Fq 'LaunchedEffect(Unit)' "$J/tools/SonusLiveMedia.kt" || fail "palco de mídia deve iniciar sem aguardar a lista secundária."
          grep -Fq 'delay(7_000L)' "$J/tools/SonusLiveStudio.kt" || fail "tempo de exibição dos controles da LIVE deve ser 7 segundos."
          grep -Fq '2L * 60L * 1000L' "$J/tools/SonusOnlineMusic.kt" || fail "cache curto dos metadados do Stream ausente."
          grep -Fq '3L * 60L * 1000L' "$J/tools/SonusOnlineMusic.kt" || fail "cache curto do catálogo do Stream ausente."
          grep -Fq 'sonusonline://pcloud' "$J/tools/SonusOnlineMusic.kt" || fail "deep link interno de compartilhamento ausente."
          grep -Fq 'AUDIO_RENAME' "$J/tools/ToolSuiteScreen.kt" || fail "separação de renomear áudios ausente."
          grep -Fq 'SONUS_GALLERY_PUBLIC_CODES' "$J/tools/SonusLiveMedia.kt" || fail "galerias adicionais para Live ausentes."
          grep -Fq 'LiveContentFamily.RELIGIOUS' "$J/tools/SonusLiveMedia.kt" || fail "filtro de mídia religiosa da LIVE ausente."
          grep -Fq 'LiveContentFamily.SECULAR' "$J/tools/SonusLiveMedia.kt" || fail "filtro de mídia secular da LIVE ausente."
          grep -Fq 'SonusOfflineDownloadManager.download' "$J/tools/SonusOnlineMusic.kt" || fail "downloads offline do Stream ausentes."
          grep -Fq 'Biblioteca offline' "$J/tools/SonusOnlineMusic.kt" || fail "biblioteca offline do Stream ausente."
          grep -Fq 'SONUS Stream • Offline' "$J/tools/SonusOnlineMusic.kt" || fail "modo offline exclusivo do Stream ausente."
          grep -Fq 'NetworkCapabilities.NET_CAPABILITY_VALIDATED' "$J/tools/SonusOnlineMusic.kt" || fail "detecção de conectividade validada ausente."
          grep -Fq 'downloadCollection(list, "Álbum' "$J/tools/SonusOnlineMusic.kt" || fail "download de álbum ausente."
          grep -Fq 'downloadCollection(pts, "Playlist' "$J/tools/SonusOnlineMusic.kt" || fail "download de playlist ausente."
          grep -Fq 'SonusOfflineDownloadManager.fileFor' "$J/tools/PulsePlayerService.kt" || fail "reprodução offline no serviço do player ausente."
          grep -Fq 'ToolId.AUDIO_MONITOR' "$J/tools/ToolSuiteScreen.kt" || fail "Monitor de Áudio não foi ligado à categoria de músicas."
          grep -Fq 'SonusAudioMonitorScreen' "$J/tools/ToolSuiteScreen.kt" || fail "tela do Monitor de Áudio ausente."
          grep -Fq 'require(isSafeHeadphone(output))' "$J/tools/SonusAudioMonitor.kt" || fail "bloqueio de saída de caixa de som ausente."
          grep -Fq 'toHttpsShareUrl' "$J/tools/PulsePlayerScreen.kt" || fail "URL HTTPS de compartilhamento ausente no Player."
          grep -Fq 'SONUS_SHARE_BASE' "$J/tools/SonusOnlineMusic.kt" || fail "base HTTPS pública de compartilhamento ausente no app."
          grep -Fq 'exports.sonusShare = onRequest' "$PROJECT_DIR/functions/sonus-stream-proxy/index.js" || fail "função HTTPS de compartilhamento ausente."
          grep -Fq 'kZwyCSJZUAqjAxCrE9zIvbA8MWP1rXS3YaAV' "$J/tools/SonusOnlineMusic.kt" || fail "terceira galeria Social Edit ausente."
          grep -Fq 'NEGATIVE_TTL_MS' "$J/tools/SonusLyricsResolver.kt" || fail "cache negativo do LRCLIB ausente."
          grep -Fq 'SonusLockScreenController.contentIntent' "$J/tools/PulsePlayerService.kt" || fail "tela de bloqueio não ligada ao serviço."
          grep -Fq 'android:showWhenLocked="true"' "$MANIFEST" || fail "atividade da tela de bloqueio ausente no manifest."
          grep -Fq 'Theme.SonusLockScreen' "$RES/values/styles.xml" || fail "tema da tela de bloqueio ausente."

          # ── Regressões Kotlin corrigidas no Build Fix ──
          grep -Fq 'dailyRecords: Int = 0' "$J/data/BackupManager.kt" || fail "campo de registros diários ausente no manifesto do backup."
          grep -Fq 'dailyRecords = state.preferences.appUsageDailyMillis.size' "$J/data/BackupManager.kt" || fail "contagem de registros diários do backup ausente."
          grep -Fq 'import androidx.compose.foundation.gestures.detectTapGestures' "$J/tools/SonusPdfStudio.kt" || fail "import do gesto de toque ausente no PDF Studio."
          grep -Fq 'val canvasSize = this.size' "$J/tools/SonusPdfStudio.kt" || fail "dimensões Float do Canvas não estão sendo usadas no PDF Studio."
          if grep -Fq 'refreshGlobalFinancialLearning()' "$J/MainActivity.kt"; then
            fail "chamada órfã para refreshGlobalFinancialLearning (rotina não presente nesta versão) encontrada."
          fi

          # ── Funções que NÃO podem voltar (YouTube e distribuição foram removidos) ──
          for f in tools/YouTubeKaraoke.kt tools/YouTubePlaylistHub.kt core/RoyaltyEngine.kt core/DistributorRules.kt core/AudioDistributorCatalog.kt \
                   core/RoyaltyReferenceCatalog.kt core/StreamMetricsEngine.kt export/ReportPdfManager.kt data/FinancialLearningCloud.kt; do
            [ ! -f "$J/$f" ] || fail "arquivo removido não deve voltar: $f"
          done
          if grep -R -I -l -e 'YOUTUBE_API_KEY' -e 'androidyoutubeplayer' "$PROJECT_DIR/app/src" "$APP_GRADLE" >/dev/null 2>&1; then
            fail "referências ao YouTube não devem voltar (YOUTUBE_API_KEY/androidyoutubeplayer)."
          fi
          if grep -R -I -l -e 'DistributionHubScreen' -e 'DistributorInfoScreen' -e 'AppPage.DISTRIBUTION' "$J" >/dev/null 2>&1; then
            fail "a função de distribuição e pagamentos não deve voltar."
          fi
          if ls "$RES"/raw/radio_*.mp3 >/dev/null 2>&1; then
            fail "locuções embutidas (res/raw/radio_*.mp3) devem ficar só na nuvem."
          fi
          grep -Fq 'Checar atualização' "$J/MainActivity.kt" && fail "opção 'Checar atualização' foi removida das Configurações."
          grep -Fq 'Opções de privacidade' "$J/MainActivity.kt" && fail "opção 'Opções de privacidade' foi removida das Configurações."

          # ── Ícones (logo rosa + paleta de 26 opções) ──
          ADAPTIVE_COUNT="$(ls "$RES"/mipmap-anydpi-v26/ic_launcher_*.xml | wc -l | tr -d ' ')"
          [ "$ADAPTIVE_COUNT" -ge 28 ] || fail "ícones adaptativos alternativos incompletos ($ADAPTIVE_COUNT)."
          for f in ic_launcher.xml ic_launcher_round.xml; do [ -f "$RES/mipmap-anydpi-v26/$f" ] || fail "$f adaptativo ausente."; done
          [ -f "$RES/drawable-nodpi/ic_mono_symbol.webp" ] || fail "camada monocromática ausente."
          if grep -Fq 'R.mipmap.ic_launcher_' "$J/core/AppIconCatalog.kt"; then fail "prévia de ícone não pode usar mipmap adaptativo (painterResource falha)."; fi

          # ── XML válido ──
          for xml in "$MANIFEST" "$RES"/values/*.xml "$RES"/mipmap-anydpi-v26/*.xml; do
            python3 -c "import sys,xml.dom.minidom as m; m.parse(sys.argv[1])" "$xml" || fail "XML inválido: $xml"
          done

          # ── Firebase Auth / Google Sign-In: validar projeto, pacote e OAuth antes do build ──
          GS="$PROJECT_DIR/app/google-services.json"
          [ -f "$GS" ] || fail "app/google-services.json ausente; login Google não estará configurado."
          python3 - "$GS" <<'PY_FIREBASE_CHECK'
          import json, sys
          path = sys.argv[1]
          expected_project = "streenpulse"
          expected_package = "com.sonusstudios.streampulse"
          expected_sha1 = "8d5398c915e1f05ce6c144caee5ad91e31dac092"
          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              raise SystemExit(f"ERRO: google-services.json inválido: {exc}")
          project = data.get("project_info", {}).get("project_id")
          if project != expected_project:
              raise SystemExit(f"ERRO: Firebase project_id incorreto: {project!r}; esperado {expected_project!r}.")
          app_clients = [c for c in data.get("client", [])
                         if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected_package]
          if not app_clients:
              raise SystemExit(f"ERRO: google-services.json não contém o pacote {expected_package}.")
          android_ok = any(
              o.get("client_type") == 1 and
              o.get("android_info", {}).get("package_name") == expected_package and
              o.get("android_info", {}).get("certificate_hash", "").lower().replace(":", "") == expected_sha1
              for c in app_clients for o in c.get("oauth_client", [])
          )
          if not android_ok:
              raise SystemExit("ERRO: cliente OAuth Android ausente para a SHA-1 da assinatura permanente.")
          web_ok = any(o.get("client_type") == 3 for c in app_clients for o in c.get("oauth_client", []))
          if not web_ok:
              raise SystemExit("ERRO: cliente OAuth Web (client_type 3) ausente; default_web_client_id não será gerado.")
          print("Firebase validado: projeto, pacote, SHA-1 Android e cliente OAuth Web corretos.")
          PY_FIREBASE_CHECK
          echo "Validação estática 0.0.7 concluída."

      - name: Publicar regras Firebase (opcional)
        script: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON_B64:-}" ]; then
            echo "INFO: credencial Firebase não configurada no Codemagic; as regras não serão publicadas automaticamente."
            echo "Se houver Permission denied em produção, publique firebase-database-rules.json no projeto streenpulse."
            exit 0
          fi
          python3 -c 'import base64, os; open("/tmp/sonus-firebase-service-account.json", "wb").write(base64.b64decode(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON_B64"]))'
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sonus-firebase-service-account.json
          trap 'rm -f /tmp/sonus-firebase-service-account.json' EXIT
          cd "$PROJECT_DIR"
          npx --yes firebase-tools@latest deploy --only database --project streenpulse --non-interactive
          rm -f /tmp/sonus-firebase-service-account.json
          echo "Regras Firebase publicadas com sucesso."

      - name: Publicar link HTTPS de compartilhamento (automático com credencial)
        script: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON_B64:-}" ]; then
            echo "AVISO: sonusShare não foi publicada. Configure FIREBASE_SERVICE_ACCOUNT_JSON_B64 como variável segura para ativar links de compartilhamento."
            exit 0
          fi
          python3 -c 'import base64, os; open("/tmp/sonus-firebase-service-account-share.json", "wb").write(base64.b64decode(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON_B64"]))'
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sonus-firebase-service-account-share.json
          trap 'rm -f /tmp/sonus-firebase-service-account-share.json' EXIT
          cd "$PROJECT_DIR"
          npx --yes firebase-tools@latest deploy --only functions:sonusShare,hosting --project streenpulse --non-interactive
          echo "Página HTTPS e função de compartilhamento publicadas no Firebase Hosting."

      - name: Verificar Android SDK 36
        script: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERRO: Android SDK não encontrado no ambiente Codemagic."
            exit 1
          fi
          echo "sdk.dir=$SDK_ROOT" > "$PROJECT_DIR/local.properties"
          echo "ANDROID_SDK_ROOT_RESOLVED=$SDK_ROOT" >> "$CM_ENV"
          NEED_PLATFORM=0
          NEED_BUILD_TOOLS=0
          [ -d "$SDK_ROOT/platforms/android-36" ] || NEED_PLATFORM=1
          [ -d "$SDK_ROOT/build-tools/36.0.0" ] || NEED_BUILD_TOOLS=1
          if [ "$NEED_PLATFORM" -eq 1 ] || [ "$NEED_BUILD_TOOLS" -eq 1 ]; then
            SDKMANAGER=""
            for CANDIDATE in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$(command -v sdkmanager 2>/dev/null || true)"; do
              if [ -n "$CANDIDATE" ] && [ -x "$CANDIDATE" ]; then SDKMANAGER="$CANDIDATE"; break; fi
            done
            [ -n "$SDKMANAGER" ] || { echo "ERRO: SDK 36 ausente e sdkmanager não localizado."; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            PACKAGES=()
            [ "$NEED_PLATFORM" -eq 1 ] && PACKAGES+=("platforms;android-36")
            [ "$NEED_BUILD_TOOLS" -eq 1 ] && PACKAGES+=("build-tools;36.0.0")
            "$SDKMANAGER" "${PACKAGES[@]}"
          fi
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          echo "Android SDK 36 / Build Tools 36.0.0: OK"

      - name: Preparar Gradle 8.13
        script: |
          set -euo pipefail
          GRADLE_HOME_CM="$HOME/.gradle/codemagic/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME_CM/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle/codemagic"
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "/tmp/gradle-${GRADLE_VERSION}.zip"
            rm -rf "$GRADLE_HOME_CM"
            unzip -q "/tmp/gradle-${GRADLE_VERSION}.zip" -d "$HOME/.gradle/codemagic"
          fi
          "$GRADLE_HOME_CM/bin/gradle" --version
          echo "GRADLE_CM=$GRADLE_HOME_CM/bin/gradle" >> "$CM_ENV"

      - name: Compilar APK SONUS
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$CM_BUILD_DIR/sonus_artifacts"
          set +e
          "$GRADLE_CM" \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :app:assembleDebug 2>&1 | tee "$CM_BUILD_DIR/sonus_artifacts/BUILD.log"
          GRADLE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GRADLE_STATUS" -ne 0 ]; then
            echo "ERRO: assembleDebug falhou. Consulte sonus_artifacts/BUILD.log"
            exit "$GRADLE_STATUS"
          fi

      - name: Conferir assinatura do APK e preparar download
        script: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: assembleDebug terminou sem gerar app-debug.apk."
            exit 1
          fi
          APKSIGNER="$ANDROID_SDK_ROOT_RESOLVED/build-tools/36.0.0/apksigner"
          if [ -z "${SONUS_KEYSTORE_PATH:-}" ]; then
            echo "ERRO: SONUS_KEYSTORE_PATH ausente. Recusando entregar APK sem assinatura oficial."
            exit 1
          fi
          if [ ! -x "$APKSIGNER" ]; then
            echo "ERRO: apksigner não encontrado; não é seguro entregar APK sem conferir a assinatura."
            exit 1
          fi
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: *//' | tr -d ' ' | tr 'A-F' 'a-f')"
          if [ "$CERT" != "ff38fea1785871c7189c1820223be450df58d73dcf9c58b7ca2e5df7e501cb6f" ]; then
            echo "ERRO: o APK NÃO foi assinado com a chave permanente oficial do SONUS ($CERT)."
            exit 1
          fi
          echo "Assinatura do APK conferida: chave permanente sonus-edit-dev.jks (SHA-256 oficial)."
          mkdir -p "$CM_BUILD_DIR/sonus_artifacts"
          cp "$APK" "$CM_BUILD_DIR/sonus_artifacts/SONUS.apk"
          cd "$CM_BUILD_DIR/sonus_artifacts"
          shasum -a 256 SONUS.apk > SHA256SUMS.txt
          ls -lh SONUS.apk SHA256SUMS.txt
          echo "SONUS.apk 0.0.7 (code 07) pronto nos Artifacts do Codemagic."

    artifacts:
      - sonus_artifacts/SONUS.apk
      - sonus_artifacts/SHA256SUMS.txt
      - sonus_artifacts/BUILD.log
