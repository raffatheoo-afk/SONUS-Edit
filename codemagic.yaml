workflows:
  sonus-edit-1-0-7-code17:
    name: Sonus Edit 1.0.7 CODE17
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Use the existing Application Environment Variables group shown in Codemagic.
      # This workflow intentionally does NOT reference Code signing identities.
      # CM_KEYSTORE is the Base64-encoded original keystore already stored as Secret.
      groups:
        - sonus_edit_release
      vars:
        CM_CLONE_DEPTH: 1
        CM_CLONE_UNSHALLOW: 'false'
        java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/codemagic
    scripts:
      - name: Prepare Sonus Edit package
        script: |
          set -euo pipefail
          # Prefer the packaged ZIP when present. This prevents a stale SonusEdit/ checkout
          # from silently overriding a newer package uploaded to the repository.
          EXTRACT_ROOT="$CM_BUILD_DIR/_sonus_edit_current"
          PROJECT_DIR=""
          ZIP=""
          for candidate in "$CM_BUILD_DIR/SonusEdit_1.0.7_CODE17.zip" "$CM_BUILD_DIR/SonusEdit.zip"; do
            if [ -f "$candidate" ]; then ZIP="$candidate"; break; fi
          done
          if [ -n "$ZIP" ]; then
            echo "Usando pacote ZIP: $ZIP"
            rm -rf "$EXTRACT_ROOT"
            mkdir -p "$EXTRACT_ROOT"
            unzip -q "$ZIP" -d "$EXTRACT_ROOT"
            SETTINGS="$(find "$EXTRACT_ROOT" -maxdepth 3 -type f -name settings.gradle.kts | head -n 1)"
            if [ -z "$SETTINGS" ]; then
              echo "ERROR: O ZIP selecionado não contém settings.gradle.kts na raiz esperada."
              find "$EXTRACT_ROOT" -maxdepth 4 -type f -name settings.gradle.kts -print
              exit 22
            fi
            PROJECT_DIR="$(dirname "$SETTINGS")"
          elif [ -f "$CM_BUILD_DIR/SonusEdit/settings.gradle.kts" ]; then
            PROJECT_DIR="$CM_BUILD_DIR/SonusEdit"
            echo "Nenhum ZIP SonusEdit*.zip encontrado; usando pasta do repositório: $PROJECT_DIR"
          else
            echo "ERROR: Nenhum pacote SonusEdit*.zip ou pasta SonusEdit/ válido foi encontrado."
            find "$CM_BUILD_DIR" -maxdepth 2 -type f -print | head -n 100
            exit 21
          fi
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -qx 'versionName=1.0.7' "$PROJECT_DIR/BUILD_VERSION.txt"
          grep -qx 'versionCode=17' "$PROJECT_DIR/BUILD_VERSION.txt"
          grep -q 'versionName = "1.0.7"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 17' "$PROJECT_DIR/app/build.gradle.kts"
          echo "SONUS_EDIT_PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Projeto preparado em: $PROJECT_DIR"

      - name: Validate Sonus Edit 1.0.7 CODE17
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"
          FLOW=app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen18.kt
          MODELS=app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          EXPORTER=app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          VISUAL=app/src/main/java/com/sonusstudios/sonusedit/media/VideoVisualEffects.kt
          CATALOG=app/src/main/java/com/sonusstudios/sonusedit/catalog/PCloudCatalog.kt
          CATALOG_REPO=app/src/main/java/com/sonusstudios/sonusedit/catalog/PCloudCatalogRepository.kt
          PCLOUD_CLIENT=app/src/main/java/com/sonusstudios/sonusedit/catalog/PCloudPublicCatalogClient.kt
          LINK=app/src/main/java/com/sonusstudios/sonusedit/create/LinkAudioImporter.kt
          WHISPER=app/src/main/java/com/sonusstudios/sonusedit/create/WhisperCaptionEngine.kt
          WAV=app/src/main/java/com/sonusstudios/sonusedit/create/AudioSegmentWavExtractor.kt
          ROUTER=app/src/main/java/com/sonusstudios/sonusedit/integration/IncomingIntentRouter.kt
          CONTRACT=app/src/main/java/com/sonusstudios/sonusedit/integration/SonusLinkContract.kt
          APP=app/src/main/java/com/sonusstudios/sonusedit/ui/SonusEditApp.kt
          STATS=app/src/main/java/com/sonusstudios/sonusedit/stats/UsageStatsStore.kt
          STATS_UI=app/src/main/java/com/sonusstudios/sonusedit/ui/StatisticsScreen.kt
          KEY_SHADER=app/src/main/res/raw/sonus_video_key_fragment.glsl

          for f in "$FLOW" "$MODELS" "$EXPORTER" "$VISUAL" "$CATALOG" "$CATALOG_REPO" "$PCLOUD_CLIENT" "$LINK" "$WHISPER" "$WAV" "$ROUTER" "$CONTRACT" "$APP" "$STATS" "$STATS_UI" "$KEY_SHADER" \
            app/src/main/java/com/sonusstudios/sonusedit/create/VideoAudioSourceInspector.kt \
            app/src/main/java/com/sonusstudios/sonusedit/create/AudioDurationProbe13.kt \
            app/src/main/java/com/sonusstudios/sonusedit/create/GalleryQueryResultGate13.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/AudioDurationProbe13Test.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/GalleryQueryResultGate13Test.kt \
            app/src/main/java/com/sonusstudios/sonusedit/create/CreationDraftStore.kt \
            app/src/main/java/com/sonusstudios/sonusedit/create/SegmentTrimPlanner12.kt \
            app/src/main/java/com/sonusstudios/sonusedit/ui/HomeScreen.kt \
            app/src/main/java/com/sonusstudios/sonusedit/ui/AboutScreen.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/DraftResumeMaintenanceTest.kt \
            app/src/main/java/com/sonusstudios/sonusedit/media/ExportForegroundService.kt \
            app/src/main/java/com/sonusstudios/sonusedit/media/ExportEtaEstimator15.kt \
            app/src/test/java/com/sonusstudios/sonusedit/media/ExportEtaEstimator15Test.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code20AspectRatioTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code22GallerySearchTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code30CaptionFontPoolTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code31CaptionStylesTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code07CaptionPositionTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code02ExportAndRatiosTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code03ImageCooldownTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code03CaptionLanguageHintTest.kt \
            app/src/main/java/com/sonusstudios/sonusedit/media/ExportCapabilities02.kt \
            app/src/main/java/com/sonusstudios/sonusedit/ui/CaptionAdjustSliders.kt \
            app/src/main/java/com/sonusstudios/sonusedit/ui/AutoCaptionsScreen.kt \
            app/src/main/java/com/sonusstudios/sonusedit/media/CaptionStyleRenderer.kt \
            app/src/main/java/com/sonusstudios/sonusedit/catalog/GallerySearchRotation.kt \
            app/src/test/java/com/sonusstudios/sonusedit/catalog/GallerySearchRotationTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code24LyricPaletteTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/Code29FontAndImageRotationTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/AutomationPlannerTest.kt \
            scripts/validate_v1_0_7_code17.py \
            app/src/main/java/com/sonusstudios/sonusedit/create/RemoteImageSelection14.kt \
            app/src/main/java/com/sonusstudios/sonusedit/create/CaptionRequestGuard14.kt \
            app/src/main/java/com/sonusstudios/sonusedit/create/GalleryQueryRequestGate14.kt \
            app/src/main/java/com/sonusstudios/sonusedit/catalog/PCloudCatalogNodeParser14.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/RemoteImageSelection14Test.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/CaptionRequestGuard14Test.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/GalleryQueryRequestGate14Test.kt \
            app/src/test/java/com/sonusstudios/sonusedit/catalog/PCloudCatalogNodeParser14Test.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/ExportMetadataPolicy14Test.kt \
            app/src/main/java/com/sonusstudios/sonusedit/catalog/StreamMetadataStore.kt \
            app/src/main/java/com/sonusstudios/sonusedit/catalog/StreamCatalogMetadataMapper.kt \
            app/src/test/java/com/sonusstudios/sonusedit/catalog/StreamCatalogMetadataMapper13Test.kt \
            app/src/main/java/com/sonusstudios/sonusedit/catalog/PCloudSearchCachePolicy.kt \
            app/src/main/java/com/sonusstudios/sonusedit/create/VisualTransitionPreferences.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/VisualTransitionCatalogTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/ImageCooldownPlannerTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/create/SmartImageSelectorManualSearchTest.kt \
            app/src/test/java/com/sonusstudios/sonusedit/catalog/PCloudSearchCachePolicyTest.kt \
            CODE23_APPROVED_SCOPE.txt CODE23_IMPLEMENTATION.md; do
            test -f "$f"
          done

          # code04 regression guards: bounded trim preview, per-export caption toggle and selection review.
          grep -q 'TrimPreviewPlanner04.shouldStop' "$FLOW"
          grep -q 'memoryExhausted' app/src/main/java/com/sonusstudios/sonusedit/media/ExportCapabilities02.kt
          grep -q 'TrimPreviewPlanner04.endPreviewPosition' "$FLOW"
          grep -q 'captionsEnabledForVideo' app/src/main/java/com/sonusstudios/sonusedit/create/CreationDraftStore.kt
          grep -q 'Mídias selecionadas' "$FLOW"
          grep -q 'BUSCANDO' "$FLOW"
          test -f app/src/main/java/com/sonusstudios/sonusedit/create/TrimPreviewPlanner04.kt
          test -f app/src/test/java/com/sonusstudios/sonusedit/create/Code04TrimPreviewTest.kt

          # Version/dependency/signing contracts.
          grep -q 'applicationId = "com.sonusstudios.sonusedit"' app/build.gradle.kts
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'versionName = "1.0.7"' app/build.gradle.kts
          grep -q 'versionName=1.0.7' BUILD_VERSION.txt
          grep -q 'versionCode=17' BUILD_VERSION.txt
          grep -q 'Text("1.0.7"' app/src/main/java/com/sonusstudios/sonusedit/ui/HomeScreen.kt
          grep -q 'Text("1.0.7"' "$FLOW"
          grep -q 'Versão 1.0.7' app/src/main/java/com/sonusstudios/sonusedit/ui/AboutScreen.kt
          grep -q '1.0.7 • CODE 17' app/src/main/java/com/sonusstudios/sonusedit/ui/AboutScreen.kt
          grep -q 'io.github.junkfood02.youtubedl-android:library:0.18.1' app/build.gradle.kts
          grep -q 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1' app/build.gradle.kts
          grep -q 'dev.ffmpegkit-maintained:whisper-android:1.0.0' app/build.gradle.kts
          test "$(grep -c 'androidx.media3:media3-.*:1.10.1' app/build.gradle.kts)" -eq 5
          grep -q 'android:extractNativeLibs="true"' app/src/main/AndroidManifest.xml

          # Link stays on the proven code22 path.
          grep -q 'import com.yausername.ffmpeg.FFmpeg' "$LINK"
          grep -q 'FFmpeg.getInstance().init' "$LINK"
          grep -q 'repeat(2)' "$FLOW"
          grep -q 'linkImportJob?.isActive == true' "$FLOW"
          grep -q 'updateYoutubeDL' "$LINK"
          grep -q 'UpdateChannel.STABLE' "$LINK"
          grep -q 'ExportRecoveryPolicy14.shouldRetryInChunks' "$EXPORTER"
          grep -q 'setMaxDelayBetweenMuxerSamplesMs' "$EXPORTER"
          grep -q 'CaptionEtaEstimator14' "$FLOW"
          grep -q 'ENGINE_VERSION = 17' "$WHISPER"

          # Kotlin 2.x nullability/type-inference regression guard (code23 build fix 1).
          ! grep -q 'runCatching(Uri::parse)' "$ROUTER"
          ! grep -q 'let(::loadMediaBitmap18)' "$FLOW"
          grep -q 'runCatching { Uri.parse(raw) }' "$ROUTER"
          grep -q 'loadRemoteAssetThumbnail18' "$FLOW"

          # SONUS -> Edit bridge: legacy + rich explicit contract.
          grep -q 'data class SonusTrack' "$ROUTER"
          grep -q 'EXTRA_AUDIO_URI' "$ROUTER"
          grep -q 'EXTRA_CAPTIONS_JSON' "$ROUTER"
          grep -q 'Intent.ACTION_SEND' "$ROUTER"
          grep -q 'streamAssetMatches' "$FLOW"
          grep -q 'ensureStreamCatalog(true)' "$FLOW"
          grep -q 'parseIncomingCaptions' "$FLOW"
          grep -q 'Carregando música compartilhada pelo SONUS' "$APP"
          grep -q 'const val SONUS_PACKAGE = "com.sonusstudios.streampulse"' "$CONTRACT"

          # Compact editing GPS; Home remains a separate screen.
          grep -q 'private fun CreateHeader18' "$FLOW"
          grep -q 'Icons.Default.MusicNote' "$FLOW"
          grep -q 'Icons.Default.Image' "$FLOW"
          grep -q 'Icons.Default.AutoAwesome' "$FLOW"
          grep -q 'Icons.Default.FactCheck' "$FLOW"
          grep -q 'Color(0xFF6F2027)' "$FLOW"
          ! grep -q 'StepIndicator18' "$FLOW"

          # Stream: artwork, shuffle and temporary search/list.
          grep -q 'MusicArtwork18' "$FLOW"
          grep -q 'Icons.Default.Shuffle' "$FLOW"
          grep -q 'showStreamBrowser' "$FLOW"
          grep -q 'Pesquisar música ou artista' "$FLOW"
          grep -q 'chooseSpecificStream' "$FLOW"

          # Gallery code23: no runtime artist DB, no automatic image marking, fixed controls + shuffled pool.
          test ! -f app/src/main/assets/sonus_artist_genres.db
          grep -q 'artistCategory = null' "$FLOW"
          grep -q 'galleryShuffleNonce' "$FLOW"
          grep -q 'SmartImageSelector.searchManualGallery' "$FLOW"
          grep -q 'Text("Imagens e vídeos"' "$FLOW"
          grep -q 'Text("$totalSelected / $limit"' "$FLOW"
          grep -q 'FOTOS/VÍDEOS' "$FLOW"
          grep -q 'only the gallery scrolls' "$FLOW"
          grep -q 'Color(0xFF287FA8)' "$FLOW"
          python3 - <<'PY2'
          from pathlib import Path
          t=Path('app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen18.kt').read_text()
          # New project selection starts empty; no automatic assignment should exist.
          assert 'var selectedRemoteStableKeys by remember(resumeDraft)' in t
          assert 'RemoteImageSelection14.fileIds(selectedRemoteStableKeys)' in t
          assert 'selectedRemoteIds = suggested' not in t
          assert 'artistGenreResolver' not in t
          PY2

          # 9:16/16:9 contract remains intact.
          grep -q 'const val VERTICAL = "9:16"' "$MODELS"
          grep -q 'const val HORIZONTAL = "16:9"' "$MODELS"
          grep -q 'VIDEO_EXTRACTED' "$MODELS"
          grep -q 'DurationPreset.INFINITE' "$FLOW"
          grep -q 'kZpRVYJZCVInrVg53M8t2JVi0nyFVjrg28ik' "$CATALOG"
          grep -q 'class PCloudHorizontalImageRepository' "$CATALOG_REPO"
          grep -q 'draft.outputWidth()' "$EXPORTER"
          grep -q 'draft.outputHeight()' "$EXPORTER"

          # Style/Review redesign.
          grep -q 'onParticlesEnabled' "$FLOW"
          grep -q 'private fun ReviewPreview23' "$FLOW"
          grep -q 'modifier.height(58.dp)' "$FLOW"
          grep -q 'player.seekTo(startMs + next)' "$FLOW"
          grep -q 'captions.lastOrNull' "$FLOW"
          python3 - <<'PY2'
          from pathlib import Path
          t=Path('app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen18.kt').read_text()
          review_start=t.index('private fun ReviewStep18(')
          review=t[review_start:t.index('private fun ReviewPreview23(')]
          before_review=t[:review_start]
          # CODE12 intentionally moves Particles into Review and Captions into Style/Sync.
          assert 'ReviewLine18(' not in review
          assert 'particlesEnabled' in review
          assert 'onParticlesEnabled' in review
          assert 'Partículas neste vídeo' in review
          assert 'Legendas neste vídeo' not in review
          assert 'Legendas neste vídeo' in before_review
          assert 'onCaptionsEnabled' in before_review
          PY2

          # Long Whisper: sequential decode, incremental chunk cache, release model.
          grep -q 'LONG_PROJECT_MS = 10L \* 60_000L' "$WHISPER"
          grep -q 'LONG_CHUNK_MS = 45_000L' "$WHISPER"
          grep -q 'extractSequentialChunks' "$WHISPER"
          grep -q 'extractSequentialChunks' "$WAV"
          grep -q 'Legenda longa • progresso salvo' "$WHISPER"
          grep -q 'chunkCache.writeText' "$WHISPER"
          grep -q 'Whisper.releaseModel' "$WHISPER"
          grep -q 'MODEL_NAME = "ggml-small.bin"' "$WHISPER"
          grep -q 'ENGINE_VERSION = 17' "$WHISPER"

          # Long export: bounded chunks, retry only failed chunk, mux without second encode.
          grep -q 'LONG_EXPORT_THRESHOLD_MS = 10L \* 60_000L' "$EXPORTER"
          grep -q 'LONG_EXPORT_SEGMENT_MS = 4L \* 60_000L' "$EXPORTER"
          grep -q 'startLongExport' "$EXPORTER"
          grep -q 'buildLongSegmentDrafts' "$EXPORTER"
          grep -q 'concatenateMp4' "$EXPORTER"
          grep -q 'MediaMuxer' "$EXPORTER"
          grep -q 'if (retry < 1)' "$EXPORTER"
          grep -q 'Use a fresh extractor per track' "$EXPORTER"
          grep -q 'visualDurationsMs' "$MODELS"
          grep -q 'visualSourceOffsetsMs' "$MODELS"

          # Particle assets: black MP4 unchanged; green 60fps MP4 re-encoded (H.264 High, same 1080x1920/60fps/961 frames) to fit the 25 MB GitHub limit. Code21 horizontal crop remains unchanged.
          grep -q '!draft.particlesEnabled' "$EXPORTER"
          grep -q 'Presentation.LAYOUT_SCALE_TO_FIT_WITH_CROP' "$EXPORTER"
          echo 'f92090af17ebd5b4c9f47ab05b09587e9b9b17f7bc698fae80703084c1d4ca69  app/src/main/res/raw/sonus_particles_green_60fps.mp4' | shasum -a 256 -c -
          echo '79fd098ff8d51c9b8db622f502792d1bf76cf6a54a7c3bd2afbae591fea525bc  app/src/main/res/raw/sonus_particles_black_30fps.mp4' | shasum -a 256 -c -
          ! grep -R -q 'effect_particles_source.webp\|drawAnimatedEffect\|atlasFrames' app/src/main

          # CODE17: caption audio recovery, ETA, font catalog and caption coverage.
          grep -q 'warmRemoteAssetThumbnails18' "$FLOW"
          grep -q 'sonus_gallery_thumbs_v3' "$FLOW"
          grep -q 'assignmentsForExport' app/src/main/java/com/sonusstudios/sonusedit/create/VisualTransitionPreferences.kt
          grep -q 'ExportEtaEstimator15' app/src/main/java/com/sonusstudios/sonusedit/media/ExportForegroundService.kt

          # Existing safety contracts.
          grep -q 'DurationPreset(0, "∞", untilEnd = true)' "$MODELS"
          ! grep -q 'DurationPreset(90' "$MODELS"
          ! grep -q 'DurationPreset(120' "$MODELS"
          grep -q 'HARD_IMAGE_CAP = 50' "$MODELS"
          grep -q 'draft.exportFps in setOf(30, 60)' "$EXPORTER"
          grep -q 'LanczosResample.scaleToFit' "$EXPORTER"
          grep -q 'Paint.Style.STROKE' "$VISUAL"
          grep -q 'Color.WHITE else Color.BLACK' "$VISUAL"
          grep -q 'import androidx.compose.material.icons.filled.Image' "$FLOW"
          ! grep -q 'Image as ImageIcon' "$FLOW"

          # Code03: multi-folder Gallery, media video thumbnails, cooldown, caption correction, premium and logo.
          grep -q 'MUSIC_PUBLIC_CODE_TERTIARY' "$CATALOG"
          grep -q 'IMAGE_PUBLIC_CODE_TERTIARY' "$CATALOG"
          grep -q 'IMAGE_HORIZONTAL_PUBLIC_CODE_SECONDARY' "$CATALOG"
          grep -q 'galleryMediaExt18 = imageExt18 + videoExt18' "$FLOW"
          grep -q 'loadRemoteAssetThumbnail18' "$FLOW"
          grep -q 'searchManualGallery' app/src/main/java/com/sonusstudios/sonusedit/create/SmartImageSelector.kt
          grep -q 'VERTICAL_PROJECTS_TO_BLOCK = 20' app/src/main/java/com/sonusstudios/sonusedit/create/SmartImageSelector.kt
          grep -q 'HORIZONTAL_PROJECTS_TO_BLOCK = 15' app/src/main/java/com/sonusstudios/sonusedit/create/SmartImageSelector.kt
          grep -q 'onCaptionEdit' app/src/main/java/com/sonusstudios/sonusedit/ui/AutoCaptionsScreen.kt
          grep -q 'onCaptionEdit' "$FLOW"
          grep -q 'Sonus Edit Premium' app/src/main/java/com/sonusstudios/sonusedit/ui/PremiumPlansScreen.kt || grep -q 'SONUS EDIT PREMIUM' app/src/main/java/com/sonusstudios/sonusedit/ui/PremiumPlansScreen.kt
          test -f app/src/main/res/drawable-nodpi/sonus_edit_icon_foreground.png
          test -f app/src/main/res/drawable-nodpi/sonus_edit_logo_center.png

          # Source guards for code24 UI, colors, project compatibility and original particle SHA256.
          test -f app/src/main/java/com/sonusstudios/sonusedit/create/CaptionEtaEstimator13.kt
          test -f app/src/test/java/com/sonusstudios/sonusedit/create/Code27CaptionEtaTest.kt
          # Includes low-memory Gallery, audio-playback and review-screen maintenance guards.
          python3 scripts/validate_v1_0_7_code17.py
          test -f app/src/test/java/com/sonusstudios/sonusedit/create/Code24LyricPaletteTest.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/media/PCloudEffectLibrary.kt

          echo "Sonus Edit 1.0.7 / CODE17 static validation passed."

      - name: Restore and verify existing Sonus Edit signer from environment group
        script: |
          set -euo pipefail

          # The user already has CM_KEYSTORE in the sonus_edit_release group.
          # Codemagic's alternative signing method also requires the keystore password.
          : "${CM_KEYSTORE:?ERRO: CM_KEYSTORE ausente no grupo sonus_edit_release.}"
          : "${CM_KEYSTORE_PASSWORD:?ERRO: adicione CM_KEYSTORE_PASSWORD como Secret no grupo sonus_edit_release. Use a senha do keystore original CODE16.}"

          # These values match the existing CODE16 signer. Override only if the
          # original keystore was deliberately configured with different values.
          CM_KEY_ALIAS="${CM_KEY_ALIAS:-sonusedit}"
          CM_KEY_PASSWORD="${CM_KEY_PASSWORD:-$CM_KEYSTORE_PASSWORD}"
          SIGN_DIR="$CM_BUILD_DIR/.sonus-edit-signing"
          CM_KEYSTORE_PATH="$SIGN_DIR/sonus-edit-dev.jks"
          mkdir -p "$SIGN_DIR" "$CM_BUILD_DIR/artifacts"
          chmod 700 "$SIGN_DIR"
          export CM_KEY_ALIAS CM_KEY_PASSWORD CM_KEYSTORE_PATH

          # Decode the already configured Base64 secret. Whitespace/newlines are ignored.
          python3 - "$CM_KEYSTORE_PATH" <<'PY_KEYSTORE'
          import base64, os, pathlib, sys
          encoded = ''.join(os.environ['CM_KEYSTORE'].split())
          try:
              raw = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"ERRO: CM_KEYSTORE não contém Base64 válido: {exc}")
          if len(raw) < 1024:
              raise SystemExit("ERRO: CM_KEYSTORE decodificado é pequeno demais para ser o keystore original.")
          target = pathlib.Path(sys.argv[1])
          target.write_bytes(raw)
          target.chmod(0o600)
          PY_KEYSTORE

          # The original CODE16 signer fingerprint is a hard guard against accidental
          # replacement by another keystore. No new key is generated by this workflow.
          KEYTOOL_REPORT="$(keytool -list -v -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" 2>&1)" || {
            echo "ERRO: não foi possível abrir o keystore. Confira CM_KEYSTORE e CM_KEYSTORE_PASSWORD." >&2
            exit 32
          }
          ACTUAL_FINGERPRINT="$(printf '%s\n' "$KEYTOOL_REPORT" | awk -F': ' '/SHA256:/{print toupper($2); exit}' | tr -d '[:space:]')"
          EXPECTED_FINGERPRINT="FF:38:FE:A1:78:58:71:C7:18:9C:18:20:22:3B:E4:50:DF:58:D7:3D:CF:9C:58:B7:CA:2E:5D:F7:E5:01:CB:6F"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "ERRO: CM_KEYSTORE não corresponde à assinatura original SONUS EDIT CODE16. Build cancelado para preservar a identidade do aplicativo." >&2
            echo "Fingerprint esperado: $EXPECTED_FINGERPRINT" >&2
            echo "Fingerprint recebido: ${ACTUAL_FINGERPRINT:-não identificado}" >&2
            exit 33
          fi

          # Validate the private-key password as well (without printing credentials).
          CHECK_DIR="$SIGN_DIR/check"
          mkdir -p "$CHECK_DIR"
          cat > "$CHECK_DIR/VerifySonusSigningKey.java" <<'JAVA_VERIFY'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.PrivateKey;
          public final class VerifySonusSigningKey {
              public static void main(String[] args) throws Exception {
                  String path = System.getenv("CM_KEYSTORE_PATH");
                  String alias = System.getenv("CM_KEY_ALIAS");
                  char[] storePassword = System.getenv("CM_KEYSTORE_PASSWORD").toCharArray();
                  char[] keyPassword = System.getenv("CM_KEY_PASSWORD").toCharArray();
                  KeyStore store = KeyStore.getInstance("JKS");
                  try (FileInputStream in = new FileInputStream(path)) { store.load(in, storePassword); }
                  if (!store.containsAlias(alias)) throw new IllegalStateException("Alias original ausente.");
                  Key key = store.getKey(alias, keyPassword);
                  if (!(key instanceof PrivateKey)) throw new IllegalStateException("Alias não contém chave privada.");
                  System.out.println("Keystore, alias e senha da chave privada validados.");
              }
          }
          JAVA_VERIFY
          javac -d "$CHECK_DIR" "$CHECK_DIR/VerifySonusSigningKey.java"
          java -cp "$CHECK_DIR" VerifySonusSigningKey
          rm -rf "$CHECK_DIR"

          # Feed the existing Gradle signing contract (SONUS_*) and keep the standard
          # Codemagic path variables available for diagnostics.
          {
            printf 'CM_KEYSTORE_PATH=%s\n' "$CM_KEYSTORE_PATH"
            printf 'CM_KEY_ALIAS=%s\n' "$CM_KEY_ALIAS"
            printf 'CM_KEY_PASSWORD=%s\n' "$CM_KEY_PASSWORD"
            printf 'SONUS_KEYSTORE_PATH=%s\n' "$CM_KEYSTORE_PATH"
            printf 'SONUS_KEYSTORE_PASSWORD=%s\n' "$CM_KEYSTORE_PASSWORD"
            printf 'SONUS_KEY_ALIAS=%s\n' "$CM_KEY_ALIAS"
            printf 'SONUS_KEY_PASSWORD=%s\n' "$CM_KEY_PASSWORD"
          } >> "$CM_ENV"
          echo "Assinatura original CODE16 validada por fingerprint e chave privada; nenhum keystore novo foi criado."

      - name: Install Gradle 8.13
        script: |
          set -euo pipefail
          GRADLE_VERSION=8.13
          GRADLE_HOME_CM="$HOME/.gradle/codemagic/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME_CM/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle/codemagic"
            curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "/tmp/gradle-${GRADLE_VERSION}.zip"
            unzip -q "/tmp/gradle-${GRADLE_VERSION}.zip" -d "$HOME/.gradle/codemagic"
          fi
          echo "GRADLE_CM=$GRADLE_HOME_CM/bin/gradle" >> "$CM_ENV"
          "$GRADLE_HOME_CM/bin/gradle" --version

      - name: Compile debug Kotlin
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"
          "$GRADLE_CM" --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Unit tests
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"
          "$GRADLE_CM" --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"
          "$GRADLE_CM" --no-daemon --stacktrace :app:assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$APK" "$CM_BUILD_DIR/artifacts/SonusEdit.apk"
          keytool -printcert -jarfile "$CM_BUILD_DIR/artifacts/SonusEdit.apk" | sed -n '/SHA256:/p' > "$CM_BUILD_DIR/artifacts/SIGNER_SHA256.txt" || true
          shasum -a 256 "$CM_BUILD_DIR/artifacts/SonusEdit.apk" | tee "$CM_BUILD_DIR/artifacts/SHA256.txt"
    artifacts:
      - artifacts/SonusEdit.apk
      - artifacts/SHA256.txt
      - artifacts/SIGNER_SHA256.txt
      - _sonus_edit/**/app/build/test-results/**
      - _sonus_edit/**/app/build/reports/**
