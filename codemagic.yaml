workflows:
  sonus-edit-0-2-0-code02-debug:
    name: SONUS Edit 0.2.0 code02 debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/codemagic

    scripts:
      - name: Prepare SONUS Edit package
        script: |
          set -euo pipefail
          ZIP="$CM_BUILD_DIR/SONUS_EDIT_0.2.0_CODE02.zip"
          EXTRACT_ROOT="$CM_BUILD_DIR/_sonus_edit_code02"
          PROJECT_DIR="$EXTRACT_ROOT/SONUS_EDIT_0.2.0_CODE02"

          test -f "$ZIP"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          unzip -q "$ZIP" -d "$EXTRACT_ROOT"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "SONUS_EDIT_PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Projeto extraído em: $PROJECT_DIR"

      - name: Validate code02 project
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"

          test -f app/src/main/java/com/sonusstudios/sonusedit/ui/CreateFlowScreen.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/media/AutomaticVideoExporter.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/catalog/PCloudPublicCatalogClient.kt
          test -f app/src/main/java/com/sonusstudios/sonusedit/lyrics/SonusLyricsResolver.kt
          test -f app/src/main/res/drawable-nodpi/sonus_edit_logo.png

          grep -q 'applicationId = "com.sonusstudios.sonusedit"' app/build.gradle.kts
          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'versionName = "0.2.0"' app/build.gradle.kts
          grep -q 'DurationPreset(600, "10m")' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt
          grep -q 'MIN_IMAGE_SECONDS = 5' app/src/main/java/com/sonusstudios/sonusedit/create/CreateModels.kt

      - name: Install Gradle 8.13
        script: |
          set -euo pipefail
          GRADLE_VERSION=8.13
          GRADLE_HOME_CM="$HOME/.gradle/codemagic/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME_CM/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle/codemagic"
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "/tmp/gradle-${GRADLE_VERSION}.zip"
            unzip -q "/tmp/gradle-${GRADLE_VERSION}.zip" -d "$HOME/.gradle/codemagic"
          fi

          echo "GRADLE_CM=$GRADLE_HOME_CM/bin/gradle" >> "$CM_ENV"
          "$GRADLE_HOME_CM/bin/gradle" --version

      - name: Unit tests
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"
          "$GRADLE_CM" --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd "$SONUS_EDIT_PROJECT_DIR"
          "$GRADLE_CM" --no-daemon --stacktrace :app:assembleDebug

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"

          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$APK" "$CM_BUILD_DIR/artifacts/SONUS_Edit_0.2.0_code02_debug.apk"
          shasum -a 256 "$CM_BUILD_DIR/artifacts/SONUS_Edit_0.2.0_code02_debug.apk" \
            | tee "$CM_BUILD_DIR/artifacts/SHA256.txt"

    artifacts:
      - artifacts/SONUS_Edit_0.2.0_code02_debug.apk
      - artifacts/SHA256.txt
